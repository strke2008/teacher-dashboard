<!-- 🌐 صفحة الحائط العامة (عرض فقط) — تُولَّد من WALL_PUB_HTML في worker.js؛ البيانات من الخادم: /w/<رمز>/data -->
<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🧱 حائط إبداع طلابنا</title><meta name="description" content="أعمال طلابنا وإبداعاتهم"><meta property="og:title" content="🧱 حائط إبداع طلابنا"><meta property="og:description" content="أعمال طلابنا وإبداعاتهم"><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--wbg:#dbeafe;--wac:#2563eb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;color:#1e293b;background:var(--wbg) radial-gradient(rgba(0,0,0,.06) 1.2px,transparent 1.4px) 0 0/22px 22px}
body.dark{color:#e2e8f0}
header{max-width:1400px;margin:0 auto;padding:max(1rem,env(safe-area-inset-top)) 1rem .6rem}
h1{margin:0;display:inline-block;background:#fff;color:#1e293b;border:2.5px solid #1e293b;border-radius:16px;padding:.35rem .9rem;font-size:clamp(1.25rem,3.6vw,2rem);box-shadow:0 4px 0 #1e293b;transform:rotate(-.6deg)}
.desc{margin:.6rem 0 0;display:inline-block;background:#fff;color:#334155;border:2px solid #1e293b;border-radius:12px;padding:.3rem .7rem;font-size:.95rem;max-width:100%;white-space:pre-wrap}
.meta{margin-top:.5rem;display:flex;gap:.4rem;flex-wrap:wrap}
.meta span{background:#fff;color:#1e293b;border:2px solid #1e293b;border-radius:99px;padding:.12rem .65rem;font-size:.8rem;font-weight:700}
main{max-width:1400px;margin:0 auto;padding:.4rem 1rem 2rem;columns:4 260px;column-gap:14px}
.card{break-inside:avoid;margin:0 0 14px;background:var(--c);color:#1e293b;border:2.5px solid #1e293b;border-radius:18px;padding:.75rem;box-shadow:0 4px 0 #1e293b;display:flex;flex-direction:column;gap:.55rem;position:relative}
.card.pin{outline:3px solid var(--wac);outline-offset:2px}
.pinic{position:absolute;top:-14px;left:50%;font-size:1.5rem;transform:translateX(-50%) rotate(-20deg)}
.h{display:flex;align-items:center;gap:.55rem}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#fff;border:2px solid #1e293b}
.h b{font-size:.95rem}.h small{display:block;color:#64748b;font-size:.75rem}
.t{margin:0;white-space:pre-wrap;word-break:break-word;font-size:1rem;line-height:1.75;font-weight:600}
.img{display:block;border-radius:12px;overflow:hidden;border:2px solid #1e293b;background:#fff;cursor:zoom-in}
.img img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain}
video{width:100%;border-radius:12px;border:2px solid #1e293b;background:#000;max-height:60vh}
.file{display:flex;align-items:center;gap:.6rem;background:#fff;border:2px solid #1e293b;border-radius:12px;padding:.5rem;text-decoration:none;color:#1e293b;font-weight:700;font-size:.85rem}
.file b{background:#ef4444;color:#fff;border-radius:8px;padding:.4rem .5rem;font-size:.75rem}
.yt{position:relative;display:block;border-radius:12px;overflow:hidden;border:2px solid #1e293b}
.yt img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.yt i{position:absolute;inset:0;margin:auto;width:58px;height:40px;border-radius:12px;background:#ef4444;color:#fff;display:grid;place-items:center;font-style:normal}
.lnk{display:block;background:#fff;border:2px solid #1e293b;border-radius:10px;padding:.4rem .6rem;color:#1d4ed8;font-weight:700;font-size:.85rem;word-break:break-all;text-decoration:none;direction:ltr;text-align:left}
.lk{align-self:flex-end;background:#fff;border:2px solid #1e293b;border-radius:99px;padding:.15rem .65rem;font-weight:800;font-size:.85rem}
.empty,.load{margin:14vh auto 0;text-align:center;background:#fff;border:2.5px dashed #1e293b;border-radius:20px;padding:1.5rem 2rem;max-width:380px;color:#1e293b;column-span:all}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
.zoom img{max-width:96vw;max-height:94vh;border-radius:8px}
footer{text-align:center;padding:0 1rem 1.5rem;font-size:.8rem;opacity:.75}
@media (max-width:600px){main{columns:1}}
@media (min-width:601px) and (max-width:900px){main{columns:2}}
</style></head><body>
<header><h1 id="ttl">🧱 حائط إبداع طلابنا</h1><div><p class="desc" id="desc" hidden></p></div><div class="meta" id="meta"></div></header>
<main id="grid"><div class="load">⏳ جارٍ التحميل…</div></main>
<footer>🧱 حائط إبداع طلابنا · للعرض فقط</footer>
<script>
(function(){
var Q=new URLSearchParams(location.search), KEY=(Q.get("k")||"").replace(/[^0-9a-f]/g,"").slice(0,30), API=(/^https:\/\/[\w.-]+$/.test(Q.get("a")||"")?Q.get("a"):"https://homework.ahmadalmarzooq2009.workers.dev"), C={sky:["#dbeafe","#2563eb"],mint:["#d1fae5","#059669"],sun:["#fef3c7","#d97706"],rose:["#ffe4e6","#e11d48"],lilac:["#ede9fe","#7c3aed"],peach:["#ffedd5","#ea580c"],sand:["#f5efe0","#a16207"],night:["#1e293b","#38bdf8"]};
var CARD=["#fef9c3","#dcfce7","#dbeafe","#fce7f3","#ede9fe","#ffedd5","#ccfbf1","#fee2e2"];
function E(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
function yt(l){var m=/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/.exec(String(l||""));return m?m[1]:"";}
function ago(t){var d=new Date(t);try{return d.toLocaleDateString("ar-SA-u-ca-gregory",{day:"numeric",month:"long"});}catch(e){return "";}}
var grid=document.getElementById("grid");
if(!KEY){grid.innerHTML='<div class="empty"><div style="font-size:3rem">🔒</div><b>هذا الرابط غير متاح</b><p>ربما أوقفه المعلم أو تغيّر الرابط.</p></div>';return;}
function fu(p,i){return API+"/w/"+KEY+"/f?p="+encodeURIComponent(p.id)+"&i="+i;}
function card(p){
  var bg=p.byTeacher?"#e0f2fe":CARD[hash(p.id)%CARD.length], av=p.byTeacher?"🎓":(p.name?E(p.name.trim().charAt(0)):"⭐");
  var media=(p.files||[]).map(function(f){var u=fu(p,f.i);
    if(f.kind==="image")return '<a class="img" href="'+E(u)+'" data-z="'+E(u)+'"><img loading="lazy" src="'+E(u)+'" alt=""></a>';
    if(f.kind==="video")return '<video src="'+E(u)+'" controls playsinline preload="metadata"></video>';
    return '<a class="file" href="'+E(u)+'" target="_blank" rel="noopener"><b>'+(f.kind==="pdf"?"PDF":"📎")+'</b><span>'+E(f.name)+'</span></a>';}).join("");
  var y=yt(p.link), link=!p.link?"":y?'<a class="yt" href="'+E(p.link)+'" target="_blank" rel="noopener"><img loading="lazy" src="https://img.youtube.com/vi/'+y+'/hqdefault.jpg" alt=""><i>▶</i></a>':'<a class="lnk" href="'+E(p.link)+'" target="_blank" rel="noopener nofollow">🔗 '+E(p.link.replace(/^https?:\/\/(www\.)?/,"").slice(0,60))+'</a>';
  return '<article class="card'+(p.pinned?" pin":"")+'" style="--c:'+bg+'">'+(p.pinned?'<span class="pinic">📌</span>':"")+
    '<div class="h"><span class="av">'+av+'</span><div><b>'+(p.byTeacher?"المعلم":p.name?E(p.name):"عمل طالب")+'</b><small>'+E(ago(p.at))+'</small></div></div>'+
    (p.text?'<p class="t">'+E(p.text)+'</p>':"")+media+link+(window.__likes&&p.likes?'<span class="lk">❤️ '+p.likes+'</span>':"")+'</article>';}
fetch(API+"/w/"+KEY+"/data",{cache:"no-store"}).then(function(r){return r.json();}).then(function(j){
  if(!j||!j.ok){grid.innerHTML='<div class="empty"><div style="font-size:3rem">🔒</div><b>هذا الرابط غير متاح</b></div>';return;}
  var w=j.wall,c=C[w.color]||C.sky; var tt=String(w.title||"").indexOf(w.emoji||"🧱")>=0?w.title:(w.emoji||"🧱")+" "+w.title; document.title=tt; document.getElementById("ttl").textContent=tt; document.documentElement.style.setProperty("--wbg",c[0]); document.documentElement.style.setProperty("--wac",c[1]);
  if(w.color==="night")document.body.classList.add("dark"); window.__likes=w.likes;
  if(w.desc){var d=document.getElementById("desc");d.textContent=w.desc;d.hidden=false;}
  document.getElementById("meta").innerHTML='<span>📝 '+j.posts.length+' '+(j.posts.length===1?"عمل":"عملًا")+'</span>';
  grid.innerHTML=j.posts.length?j.posts.map(card).join(""):'<div class="empty"><div style="font-size:3rem">🧱</div><b>لا أعمال معروضة بعد</b></div>';
}).catch(function(){grid.innerHTML='<div class="empty">تعذّر التحميل — حدّث الصفحة</div>';});
grid.addEventListener("click",function(e){var a=e.target.closest("[data-z]");if(!a)return;e.preventDefault();var z=document.createElement("div");z.className="zoom";z.innerHTML='<img src="'+a.getAttribute("data-z")+'" alt="">';z.onclick=function(){z.remove();};document.body.appendChild(z);});
})();
</script></body></html>
