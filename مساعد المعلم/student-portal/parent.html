<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16233A">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="pwa/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="pwa/apple-touch-icon-180.png">
<title>تقرير ولي الأمر</title>
<style>
:root{--ink:#16233A;--soft:#5B6B82;--rule:#DCE3EE;--bg:#EEF2F8;--card:#fff;--ok:#13734F;--bad:#B4232F;--acc:#1F5FC8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
header{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px}
header b{font-size:1.15rem}header small{display:block;opacity:.75;font-size:.8rem}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(22,35,58,.06)}
h2{font-size:1.05rem;margin:0 0 .6rem}
label{display:grid;gap:4px;font-weight:700;font-size:.9rem;margin-bottom:10px}
input{font:inherit;padding:12px 14px;border:1.5px solid var(--rule);border-radius:12px;background:#F7F9FD;width:100%}
input:focus{outline:2px solid #9DB8EC;border-color:#9DB8EC}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#fff;cursor:pointer;width:100%}
button.ghost{background:#EEF3FB;color:var(--acc);width:auto;padding:8px 14px}
.muted{color:var(--soft);font-size:.84rem}
#nmx{margin:-4px 0 10px}#nmx .pick{background:#E9F6F0;border:1.5px solid #9BD3BB;color:var(--ink);text-align:start;font-weight:400;padding:10px 14px}#nmx .pick small{display:block;color:var(--soft);font-size:.76rem}#nmx .pick b{font-size:1rem}#nmx .hint{color:var(--soft);font-size:.82rem}
.err{color:var(--bad);font-weight:700;font-size:.9rem;margin-top:8px}
.who{display:flex;align-items:center;gap:12px}.who .av{width:52px;height:52px;border-radius:16px;background:#EEF3FB;display:grid;place-items:center;font-size:1.6rem}
.who b{font-size:1.1rem}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{border:1px solid var(--rule);border-radius:14px;padding:10px 12px}.kpi span{font-size:.8rem;color:var(--soft)}.kpi b{display:block;font-size:1.3rem}.kpi small{font-size:.76rem;color:var(--soft)}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--rule);font-size:.92rem}.row:first-of-type{border-top:0}
.tag{font-size:.74rem;font-weight:800;border-radius:99px;padding:2px 9px;white-space:nowrap}.tag.late{background:#FFE6EA;color:var(--bad)}.tag.open{background:#FFF3D6;color:#8A5A00}.tag.ok{background:#E3F4EC;color:var(--ok)}
.note{background:#F7F9FD;border-radius:12px;padding:10px 12px;white-space:pre-line;font-size:.92rem}
.sib{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
button.sm{padding:6px 12px;font-size:.85rem}
.hero .who{align-items:center}
.lv{display:flex;align-items:center;gap:16px;margin-top:14px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--c) 8%,#fff)}
.ring{--p:0;flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#E6ECF5 0)}
.ring b{width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.25rem;color:var(--c)}
.lv-t{font-size:1.6rem;font-weight:900;color:var(--c);line-height:1.3}
.ln{padding:10px 0;border-top:1px dashed var(--rule)}.ln:first-of-type{border-top:0}
.ln-h{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.ln-bar{height:9px;border-radius:99px;background:#E6ECF5;overflow:hidden;margin:6px 0 2px}.ln-bar i{display:block;height:100%;border-radius:99px}
.ln small{color:var(--soft);font-size:.78rem}
.pt{margin:.3rem 0}
details summary{cursor:pointer;margin:.3rem 0}
.sib{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{border-radius:16px;padding:12px;background:color-mix(in srgb,var(--c,#5B6B82) 7%,#fff);border:1px solid color-mix(in srgb,var(--c,#5B6B82) 22%,#fff);display:grid;gap:8px;align-content:start}
.tile.none{--c:#8A97AB}
.t-top{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.9rem}.t-ic{font-size:1.1rem}
.t-mid{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mini{--p:0;flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#E6ECF5 0)}
.mini span{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:.78rem;font-weight:900;color:var(--c)}
.t-sc{display:block;font-size:1.35rem;line-height:1.2;color:var(--ink)}.t-sc small{font-size:.8rem;color:var(--soft);font-weight:700}
.t-lv{display:inline-block;margin-top:3px;font-size:.74rem;font-weight:900;color:#fff;background:var(--c);border-radius:99px;padding:1px 9px;white-space:nowrap}
.t-sub{font-size:.76rem;color:var(--soft);line-height:1.5}

.tile.tap{cursor:pointer;transition:transform .12s,box-shadow .12s}.tile.tap:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(22,35,58,.08)}
.tile.on{outline:2.5px solid var(--c);outline-offset:1px}
.t-more{margin-inline-start:auto;flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:900;color:#fff;background:var(--c)}
.det{margin-top:12px;border-radius:16px;padding:14px;border:1.5px solid color-mix(in srgb,var(--c,#1F5FC8) 35%,#fff);background:color-mix(in srgb,var(--c,#1F5FC8) 5%,#fff)}
.det h3{margin:0 0 6px;font-size:1rem}.det ul{margin:4px 0 8px;padding-inline-start:20px}.det li{margin:2px 0}
.det .miss{color:var(--bad);font-weight:700;margin:6px 0}.det .ok{color:var(--ok);font-weight:700;margin:6px 0}
.det .how{color:var(--soft);font-size:.85rem;margin:8px 0 0}.det .tip{background:#fff;border-radius:10px;padding:8px 10px;margin:8px 0 0;font-size:.88rem}
.dk{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--rule)}.dk.low{background:#FFF1F3;border-radius:8px;padding:6px 8px;color:var(--bad)}
.dsub{background:#fff;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:.9rem}

.ring b small{display:block;font-size:.62rem;color:var(--soft);font-weight:700;margin-top:-4px}
.ring b{flex-direction:column;line-height:1.1}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.sum span{background:#fff;border-radius:99px;padding:2px 10px;font-size:.8rem;color:var(--soft)}.sum b{color:var(--ink)}
.h-sc{float:left;font-size:.85rem;background:#EEF3FB;color:var(--acc);border-radius:99px;padding:2px 10px}
.hide{display:none}
footer{text-align:center;color:var(--soft);font-size:.78rem;padding:10px 0 30px}
</style>
</head>
<body>
<header><b>👪 تقرير ولي الأمر</b><small>متابعة ابنكم في المادة — للاطلاع فقط</small></header>
<main>
  <section class="card" id="login">
    <h2>الدخول</h2>
    <p class="muted" style="margin-top:0">اكتب اسم الطالب أو جزءًا منه واختر اسمه من الاقتراح، ثم رقم جوالكم المسجّل في المدرسة.</p>
    <form id="f" autocomplete="on">
      <label>اسم الطالب<input id="nm" name="student" required placeholder="مثال: محمد عبدالله العتيبي" autocomplete="off"></label>
      <div id="nmx" class="hide"></div>
      <label>جوال ولي الأمر<input id="ph" name="tel" type="tel" inputmode="numeric" required placeholder="05xxxxxxxx" dir="ltr"></label>
      <button type="submit" id="go">عرض التقرير</button>
      <div class="err hide" id="err"></div>
    </form>
  </section>
  <div id="out"></div>
</main>
<footer>أنشطتي · تطوير: المعلم أحمد المرزوق</footer>
<script>
const API='https://homework.ahmadalmarzooq2009.workers.dev';
const KEY='parent_login_v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const pct=(a,b)=>b?Math.round(a/b*100):0;
function err(t){ const e=$('err'); e.textContent=t; e.classList.toggle('hide',!t); }
async function go(name, phone, quiet){
  err(''); $('go').disabled=true; $('go').textContent='⏳ جارٍ التحقق…';
  try{
    const r=await fetch(API+'/parent/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone})});
    const j=await r.json().catch(()=>({}));
    if(!j.ok){
      if(quiet){ $('login').classList.remove('hide'); return; }
      err(j.error==='locked'?'محاولات كثيرة غير صحيحة — حاول بعد ساعة.':r.status===404&&j.error==='no_match'?`الاسم أو رقم الجوال غير مطابق لبيانات المدرسة.${j.left!=null?` (متبقٍ ${j.left} محاولات)`:''}`:'تعذّر الاتصال — حاول لاحقًا.');
      return;
    }
    try{ localStorage.setItem(KEY,JSON.stringify({name,phone})); }catch(e){}
    $('login').classList.add('hide'); render(j, phone);
  }catch(e){ err('تعذّر الاتصال — تحقق من الإنترنت.'); }
  finally{ $('go').disabled=false; $('go').textContent='عرض التقرير'; }
}
// 💡 اقتراح الاسم الصحيح مثل «أنشطتي»: يكتب جزءًا من الاسم ويختار اسمه الكامل بلمسة
let _nT=null;
const nmBox=(h)=>{ const x=$('nmx'); x.innerHTML=h||''; x.classList.toggle('hide',!h); };
$('nm').addEventListener('input',()=>{
  clearTimeout(_nT); const q=$('nm').value.trim();
  if(!q){ nmBox(''); return; }
  _nT=setTimeout(async()=>{
    try{
      const j=await (await fetch(API+'/find',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q})})).json();
      if(q!==$('nm').value.trim()) return;
      if(j.ok&&Array.isArray(j.matches)&&j.matches.length===1){
        const nm=j.matches[0].name||'';
        if(nm.trim()===q){ nmBox('<div class="hint">✅ الاسم صحيح</div>'); return; }
        nmBox(`<button type="button" class="pick" data-nm="${esc(nm)}"><small>هل تقصد؟ اضغط للتأكيد</small><b>${esc(nm)}</b></button>`);
        $('nmx').querySelector('.pick').onclick=e=>{ $('nm').value=e.currentTarget.dataset.nm; nmBox('<div class="hint">✅ الاسم صحيح</div>'); $('ph').focus(); };
      } else if(j.error==='many') nmBox(`<div class="hint">يوجد ${j.total||'أكثر من'} طلاب بهذا الاسم — أضف اسم الأب أو العائلة</div>`);
      else if(j.error==='none') nmBox('<div class="hint" style="color:var(--bad)">لم أجد اسمًا مطابقًا — ابدأ بالاسم الأول للطالب</div>');
      else nmBox('');
    }catch(e){ nmBox(''); }
  },300);
});
const LEVELS=[[90,'ممتاز','#13734F'],[80,'جيد جدًا','#1F7A5A'],[65,'جيد','#1F5FC8'],[50,'مقبول','#B7791F'],[0,'يحتاج متابعة','#B4232F']];
const lvl=p=>LEVELS.find(x=>p>=x[0]);
function bar(label, val, max, sub, icon, key){
  // 🎯 بطاقة لكل جانب: دائرة صغيرة بالنسبة ولونها حسب المستوى، والدرجة والحكم وتفصيل قصير
  const p=max?Math.round(val/max*100):0, L=lvl(p);
  return `<div class="tile${key?' tap':''}" style="--c:${L[2]}" ${key?`data-k="${key}" role="button" tabindex="0"`:''}><div class="t-top"><span class="t-ic">${icon}</span><span class="t-nm">${label}</span>${key?'<span class="t-more" title="اضغط لمعرفة السبب">؟</span>':''}</div>
    <div class="t-mid"><div class="mini" style="--p:${p}"><span>${p}%</span></div><div><b class="t-sc">${val}<small> من ${max}</small></b><span class="t-lv">${L[1]}</span></div></div>
    ${sub?`<small class="t-sub">${sub}</small>`:''}</div>`;
}
/* 🔎 لماذا نقصت الدرجة؟ شرح كل جانب بلغة ولي الأمر: كيف تُحسب، وما الذي خصم منها، وماذا يفعل */
function parentDetails(R, A){
  const D={}, li=a=>a.length?`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`:'', ok=t=>`<p class="ok">✓ ${t}</p>`, why=(v,m)=>v>=m?ok('الدرجة كاملة — لا خصم.'):`<p class="miss">نقص <b>${+(m-v).toFixed(2)}</b> من ${m}</p>`;
  if(R&&R.participation){ const P=R.participation, net=Math.max(0,(P.no||0)-(P.yes||0));
    D.part=`<h3>🙋 المشاركة</h3>${why(P.score,P.max)}
      <div class="dk"><span>شارك</span><b>${P.yes||0}</b></div><div class="dk"><span>لم يشارك</span><b>${P.no||0}</b></div><div class="dk"><span>غاب</span><b>${P.absent||0}</b></div>
      ${P.score<P.max?'<p class="tip">💡 شجّعوه على رفع يده والإجابة في الحصة — كل مشاركة تعوّض «لم يشارك».</p>':''}`; }
  if(R&&R.homework){ const H=R.homework, C=H.classPart;
    D.hw=C?`<h3>📕 واجبات الفصل</h3>${why(C.score,C.max)}
      <div class="dk"><span>أنجز</span><b>${C.done}</b></div><div class="dk"><span>لم ينجز</span><b>${C.missed}</b></div>${C.forgiven?`<div class="dk"><span>أُعفي من</span><b>${C.forgiven}</b></div>`:''}
      ${C.missed?'<p class="tip">💡 تابعوا معه حلّ واجب الكتاب وإحضاره في الحصة التالية.</p>':''}`
      :`<h3>📕 الواجبات</h3>${why(H.score,H.max)}`; }
  if(R&&R.behavior){ const B=R.behavior, neg=(B.notes||[]).filter(n=>n.type!=='positive'), pos=(B.notes||[]).filter(n=>n.type==='positive');
    D.beh=`<h3>🤝 السلوك</h3>${why(B.score,B.max)}
      ${neg.length?`<p class="miss">ملاحظات سلبية (${neg.length}):</p>${li(neg.map(n=>`${esc(n.date)} — ${esc(n.category||'ملاحظة')}${n.note?`: ${esc(n.note)}`:''}`))}`:''}
      ${pos.length?`<p class="ok">🌟 مواقف إيجابية (${pos.length}):</p>${li(pos.map(n=>`${esc(n.date)} — ${esc(n.category||'')}${n.note?`: ${esc(n.note)}`:''}`))}`:''}`; }
  if(R&&R.exam){ const E=R.exam, T=(E.tests||[]);
    D.exam=`<h3>📝 الاختبارات</h3>${E.measured&&E.score!=null?why(E.score,E.max):'<p class="how">لم تُرصد درجات بعد.</p>'}
      ${T.length?`<div class="dt">${T.map(t=>{ const p=t.score==null?null:Math.round(t.score/t.max*100);
        return `<div class="dk${p!=null&&p<70?' low':''}"><span>${esc(t.title)}</span><b>${t.score==null?'لم يُرصد':`${t.score} من ${t.max}`}</b></div>`; }).join('')}</div>`:''}
      ${(()=>{ const w=T.filter(t=>t.score!=null&&t.score/t.max<0.7).sort((a,b)=>a.score/a.max-b.score/b.max)[0]; if(!w) return '';
        return `<p class="tip">💡 أقل درجاته في «${esc(w.title)}» (${w.score} من ${w.max}). نقترح مراجعة دروس هذا الاختبار معه${w.score/w.max<0.6?'، وستصله في البوابة مهمة علاجية بالأسئلة التي أخطأ فيها':''}.</p>`; })()}`; }
  if(A&&A.total){ const late=(A.missing||[]).filter(x=>x.late), op=(A.missing||[]).filter(x=>!x.late);
    D.acts=`<h3>💻 المهام الأدائية (أنشطة البوابة)</h3>${A.doneN>=A.total?ok('سلّم كل الأنشطة.'):`<p class="miss">لم يسلّم <b>${A.total-(A.doneN||0)}</b> من ${A.total}</p>`}
      ${late.length?`<p class="miss">⏰ متأخرة:</p>${li(late.map(x=>esc(x.t)))}`:''}${op.length?`<p class="how">📌 مفتوحة لم يحلّها:</p>${li(op.map(x=>esc(x.t)+(x.due?` <small>(حتى ${esc(x.due)})</small>`:'')))}`:''}
      <p class="tip">💡 يحلّها من بوابة الطالب «أنشطتي» — كل نشاط يُسلَّم يرفع النسبة.</p>`; }
  if(R&&R.homework&&R.homework.madrasati&&R.homework.madrasati.counted){ const M=R.homework.madrasati;
    D.mad=`<h3>📱 واجبات مدرستي</h3>${M.solved>=M.counted?ok('حلّ كل واجبات مدرستي.'):`<p class="miss">لم يحلّ <b>${M.counted-M.solved}</b> من ${M.counted}:</p>`}
      ${(M.missedList||[]).length?li(M.missedList.map(esc)):''}${(M.pendingList||[]).length?`<p class="tip">💡 مفتوح الآن في مدرستي — حلّه قبل الإغلاق: ${M.pendingList.map(x=>esc(x.title)).join('، ')}</p>`:''}
      ${M.forgiven?`<p class="how">أُعفي من ${M.forgiven}.</p>`:''}`; }
  return D;
}
function render(j, phone){
  const s=j.student, A=j.acts||{}, R=j.live||(j.reports||[])[0]||null, late=(A.missing||[]).filter(x=>x.late), open=(A.missing||[]).filter(x=>!x.late);
  // 🧮 مثل كشف الدرجات: أعمال السنة 40 (المشاركة 10 · الواجبات 10 · السلوك 10 · المهام الأدائية 10) + الاختبارات 20 = 60
  const n1=v=>Math.round((Number(v)||0)*10)/10, H=R&&R.homework||{}, C=H.classPart, M=H.madrasati;
  const AC=R&&R.activities&&R.activities.n!=null?R.activities:(A.total?{score:n1((A.doneN||0)/A.total*10),max:10,n:A.total,done:A.doneN||0}:null);
  const pS=R&&R.participation?n1(R.participation.score):0, hS=n1(H.score), bS=R&&R.behavior?n1(R.behavior.score):0, aS=AC?n1(AC.score):10;
  const work=n1(pS+hS+bS+aS), exOn=!!(R&&R.exam&&R.exam.measured&&R.exam.score!=null), exS=exOn?n1(R.exam.score):0, total=n1(work+exS);
  const level=t=>t>=54?['ممتاز','#13734F']:t>=48?['جيد جدًا','#1F7A5A']:t>=42?['جيد','#1F5FC8']:t>=30?['يحتاج متابعة','#B7791F']:['يحتاج دعم','#B4232F'];
  const out=exOn?total:work, max=exOn?60:40, LV=exOn?level(total):level(work*1.5), P=Math.round(out/max*100);
  let h=`<section class="card hero"><div class="who"><div class="av">🎓</div><div style="flex:1;min-width:0"><b>${esc(s.name)}</b><div class="muted">الفصل ${esc(s.cls||'—')}${R?` · ${esc(R.label||'')}`:''}</div></div>
      <button class="ghost sm" type="button" id="out-btn">خروج</button></div>
    ${R?`<div class="lv" style="--c:${LV[1]}"><div class="ring" style="--p:${P}"><b>${out}<small>من ${max}</small></b></div><div><span class="muted">${exOn?'مجموعه حتى الآن':'أعمال السنة حتى الآن (الاختبارات لم تُرصد)'}</span><div class="lv-t">${LV[0]}</div>
      <div class="sum"><span>📚 أعمال السنة <b>${work}</b> من 40</span><span>📝 الاختبارات <b>${exOn?exS:'—'}</b> من 20</span></div></div></div>`:''}
    ${(late.length||open.length)?`<p class="muted" style="margin:.6rem 0 0">${late.length?`⚠️ عليه ${late.length} ${late.length===1?'نشاط متأخر':'أنشطة متأخرة'}`:`📌 عليه ${open.length} ${open.length===1?'نشاط مفتوح':'أنشطة مفتوحة'} لم يحلّها بعد`} — تفاصيلها في «المهام الأدائية».</p>`:''}
    ${(j.siblings||[]).length?`<div class="sib"><span class="muted">إخوته:</span>${j.siblings.map(n=>`<button class="ghost sm" type="button" data-sib="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:''}</section>`;
  if(R){
    h+=`<section class="card"><h2>📚 أعمال السنة <span class="h-sc">${work} من 40</span></h2><p class="muted" style="margin:-.3rem 0 .7rem">اضغط أي بطاقة لمعرفة سبب درجتها.</p><div class="tiles">
      ${bar('المشاركة',pS,10,R.participation&&R.participation.absent?`غاب ${R.participation.absent} ${R.participation.absent===1?'حصة':'حصص'}`:'','🙋','part')}
      ${C&&C.max?bar('واجبات الفصل',n1(C.score),C.max,`أنجز ${C.done||0} · لم ينجز ${C.missed||0}`,'📕','hw'):''}
      ${M&&M.max?bar('واجبات مدرستي',n1(M.score),M.max,M.counted?`حلّ ${M.solved} من ${M.counted}`:'لا واجبات بعد','📱','mad'):''}
      ${!(C&&C.max)&&!(M&&M.max)?bar('الواجبات',hS,10,'','📕','hw'):''}
      ${bar('السلوك',bS,10,`🌟 ${R.behavior&&R.behavior.pos||0} إيجابي · ⚠️ ${R.behavior&&R.behavior.neg||0} سلبي`,'🤝','beh')}
      ${bar('المهام الأدائية',aS,10,AC?`سلّم ${AC.done} من ${AC.n} من أنشطة البوابة`:'','💻','acts')}
    </div></section>
    <section class="card"><h2>📝 الاختبارات <span class="h-sc">${exOn?exS:'—'} من 20</span></h2><div class="tiles">
      ${exOn?bar('الاختبارات',exS,20,(R.exam.tests||[]).filter(t=>t.score!=null).map(t=>`${esc(t.title)}: ${t.score} من ${t.max}`).join(' · '),'📝','exam'):`<div class="tile none"><div class="t-top"><span class="t-ic">📝</span><span class="t-nm">الاختبارات</span></div><span class="t-sub">لم تُرصد درجات بعد</span></div>`}
    </div><div id="det" class="det hide"></div>${R.teacherNote?`<p class="note" style="margin-top:12px">📝 <b>ملاحظة المعلم:</b> ${esc(R.teacherNote)}</p>`:''}</section>`;
  }
  const W=j.weekly&&j.weekly.d;
  if(W&&((W.ps||[]).length||(W.ng||[]).length||W.st)) h+=`<section class="card"><h2>🗓️ آخر أسبوع</h2>
      ${(W.ps||[]).length?`<p class="pt">🌟 <b>أحسن في:</b> ${W.ps.map(esc).join('، ')}</p>`:''}
      ${(W.ng||[]).length?`<p class="pt">📌 <b>يحتاج انتباهًا إلى:</b> ${W.ng.map(esc).join('، ')}</p>`:''}
      ${W.st?`<p class="note">🎯 خطوته القادمة: ${esc(W.st)}</p>`:''}</section>`;
  const old=(j.reports||[]).filter(r=>!R||r.semester!==R.semester||r.period!==R.period);
  if(old.length) h+=`<section class="card"><details><summary><b>📄 تقارير الفترات السابقة (${old.length})</b></summary>${old.map(r=>`<div class="row"><span>${esc(r.label||'')}</span><span class="muted">مشاركة ${r.participation?r.participation.score:'—'} · واجبات ${r.homework?r.homework.score:'—'} · سلوك ${r.behavior?r.behavior.score:'—'}${r.exam&&r.exam.measured?` · اختبارات ${r.exam.score}/${r.exam.max}`:''}</span></div>`).join('')}</details></section>`;
  $('out').innerHTML=h;
  const DET=parentDetails(R, A);
  $('out').querySelectorAll('.tile[data-k]').forEach(t=>{ const open=()=>{ const d=$('det'), k=t.dataset.k, was=t.classList.contains('on');
      $('out').querySelectorAll('.tile.on').forEach(x=>x.classList.remove('on'));
      if(was){ d.classList.add('hide'); return; }
      t.classList.add('on'); t.closest('section').appendChild(d); d.style.setProperty('--c', getComputedStyle(t).getPropertyValue('--c')); d.innerHTML=DET[k]||''; d.classList.remove('hide'); d.scrollIntoView({behavior:'smooth',block:'nearest'}); };
    t.onclick=open; t.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } }; });
  $('out-btn').onclick=()=>{ try{ localStorage.removeItem(KEY); }catch(e){} $('out').innerHTML=''; $('login').classList.remove('hide'); };
  $('out').querySelectorAll('[data-sib]').forEach(b=>b.onclick=()=>go(b.dataset.sib, phone));
}
$('f').onsubmit=e=>{ e.preventDefault(); go($('nm').value.trim(), $('ph').value.trim()); };
try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&s.name&&s.phone){ $('nm').value=s.name; $('ph').value=s.phone; $('login').classList.add('hide'); go(s.name,s.phone,true); } }catch(e){}
</script>
</body>
</html>
