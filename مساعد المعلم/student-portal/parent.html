<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16233A">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="pwa/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="pwa/apple-touch-icon-180.png">
<title>متابعة ولي الأمر لمستوى الطالب</title>
<style>
:root{--ink:#16233A;--soft:#5B6B82;--rule:#DCE3EE;--bg:#EEF2F8;--card:#fff;--ok:#13734F;--bad:#B4232F;--acc:#1F5FC8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
header{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px}
header b{font-size:1.15rem}header small{display:block;opacity:.75;font-size:.8rem}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(22,35,58,.06)}
h2{font-size:1.05rem;margin:0 0 .6rem}
label{display:grid;gap:4px;font-weight:700;font-size:.9rem;margin-bottom:10px}
input{font:inherit;padding:12px 14px;border:1.5px solid var(--rule);border-radius:12px;background:#F7F9FD;width:100%}
input:focus{outline:2px solid #9DB8EC;border-color:#9DB8EC}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#fff;cursor:pointer;width:100%}
button.ghost{background:#EEF3FB;color:var(--acc);width:auto;padding:8px 14px}
.muted{color:var(--soft);font-size:.84rem}
#nmx{margin:-4px 0 10px}#nmx .pick{background:#E9F6F0;border:1.5px solid #9BD3BB;color:var(--ink);text-align:start;font-weight:400;padding:10px 14px}#nmx .pick small{display:block;color:var(--soft);font-size:.76rem}#nmx .pick b{font-size:1rem}#nmx .hint{color:var(--soft);font-size:.82rem}
.err{color:var(--bad);font-weight:700;font-size:.9rem;margin-top:8px}
.who{display:flex;align-items:center;gap:12px}.who .av{width:52px;height:52px;border-radius:16px;background:#EEF3FB;display:grid;place-items:center;font-size:1.6rem}
.who b{font-size:1.1rem}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{border:1px solid var(--rule);border-radius:14px;padding:10px 12px}.kpi span{font-size:.8rem;color:var(--soft)}.kpi b{display:block;font-size:1.3rem}.kpi small{font-size:.76rem;color:var(--soft)}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--rule);font-size:.92rem}.row:first-of-type{border-top:0}
.tag{font-size:.74rem;font-weight:800;border-radius:99px;padding:2px 9px;white-space:nowrap}.tag.late{background:#FFE6EA;color:var(--bad)}.tag.open{background:#FFF3D6;color:#8A5A00}.tag.ok{background:#E3F4EC;color:var(--ok)}
.note{background:#F7F9FD;border-radius:12px;padding:10px 12px;white-space:pre-line;font-size:.92rem}
.sib{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
button.sm{padding:6px 12px;font-size:.85rem}
.hero .who{align-items:center}
.lv{display:flex;align-items:center;gap:16px;margin-top:14px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--c) 8%,#fff)}
.ring{--p:0;flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#E6ECF5 0)}
.ring b{width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.25rem;color:var(--c)}
.lv-t{font-size:1.6rem;font-weight:900;color:var(--c);line-height:1.3}
.ln{padding:10px 0;border-top:1px dashed var(--rule)}.ln:first-of-type{border-top:0}
.ln-h{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.ln-bar{height:9px;border-radius:99px;background:#E6ECF5;overflow:hidden;margin:6px 0 2px}.ln-bar i{display:block;height:100%;border-radius:99px}
.ln small{color:var(--soft);font-size:.78rem}
.pt{margin:.3rem 0}
details summary{cursor:pointer;margin:.3rem 0}
.sib{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.ptabs{display:flex;gap:6px;padding:5px;margin:-4px 0 14px;background:#EEF2F7;border-radius:16px}
.ptab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;padding:9px 6px;border:0;border-radius:12px;background:transparent;color:#475569;cursor:pointer}
.ptab b{font-size:.95rem}.ptab small{font-size:.74rem;font-weight:600;opacity:.85}
.ptab.on{background:#fff;color:#13734F;box-shadow:0 2px 8px rgba(15,23,42,.12)}.ptab.on b{color:#0F5132}
.pnudge{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%;margin-top:12px;padding:12px 14px;border-radius:14px;border:1.5px solid #F2C46B;background:#FFF8E6;color:#7A4B00;font:inherit;font-size:.9rem;text-align:right;cursor:pointer}
.pnudge b{margin:0 3px}.pnudge span{margin-inline-start:auto;font-weight:800;color:#13734F;white-space:nowrap}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{border-radius:16px;padding:12px;background:color-mix(in srgb,var(--c,#5B6B82) 7%,#fff);border:1px solid color-mix(in srgb,var(--c,#5B6B82) 22%,#fff);display:grid;gap:8px;align-content:start}
.tile.none{--c:#8A97AB}
.t-top{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.9rem}.t-ic{font-size:1.1rem}
.t-mid{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mini{--p:0;flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#E6ECF5 0)}
.mini span{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:.78rem;font-weight:900;color:var(--c)}
.t-sc{display:block;font-size:1.35rem;line-height:1.2;color:var(--ink)}.t-sc small{font-size:.8rem;color:var(--soft);font-weight:700}
.t-lv{display:inline-block;margin-top:3px;font-size:.74rem;font-weight:900;color:#fff;background:var(--c);border-radius:99px;padding:1px 9px;white-space:nowrap}
.t-sub{font-size:.76rem;color:var(--soft);line-height:1.5}

.tile.tap{cursor:pointer;transition:transform .12s,box-shadow .12s}.tile.tap:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(22,35,58,.08)}
.tile.on{outline:2.5px solid var(--c);outline-offset:1px}
.t-more{margin-inline-start:auto;flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:900;color:#fff;background:var(--c)}
.det{margin-top:12px;border-radius:16px;padding:14px;border:1.5px solid color-mix(in srgb,var(--c,#1F5FC8) 35%,#fff);background:color-mix(in srgb,var(--c,#1F5FC8) 5%,#fff)}
.det h3{margin:0 0 6px;font-size:1rem}.det ul{margin:4px 0 8px;padding-inline-start:20px}.det li{margin:2px 0}
.det .miss{color:var(--bad);font-weight:700;margin:6px 0}.det .ok{color:var(--ok);font-weight:700;margin:6px 0}
.det .grp{margin:10px 0 2px;font-weight:800;font-size:.9rem}.det .grp.open{color:#8A5A00}.det .grp.gone{color:var(--soft)}.det ul.gone li{color:var(--soft)}.det li .tag{margin-inline-start:6px;display:inline-block}
.det .how{color:var(--soft);font-size:.85rem;margin:8px 0 0}.det .tip{background:#fff;border-radius:10px;padding:8px 10px;margin:8px 0 0;font-size:.88rem}
.dk{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--rule)}.dk.low{background:#FFF1F3;border-radius:8px;padding:6px 8px;color:var(--bad)}
.dsub{background:#fff;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:.9rem}

.ring b small{display:block;font-size:.62rem;color:var(--soft);font-weight:700;margin-top:-4px}
.ring b{flex-direction:column;line-height:1.1}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.sum span{background:#fff;border-radius:99px;padding:2px 10px;font-size:.8rem;color:var(--soft)}.sum b{color:var(--ink)}
.h-sc{float:left;font-size:.85rem;background:#EEF3FB;color:var(--acc);border-radius:99px;padding:2px 10px}
.hide{display:none}
footer{text-align:center;color:var(--soft);font-size:.78rem;padding:10px 0 30px}
.pc-wrap{text-align:center}
/* 🏅 شهادة التميّز بقالب شهادات الشكر نفسه (الخلفية ونص المعلم وتوقيعاته من اللوحة) */
.mc-cert{position:relative;width:100%;aspect-ratio:297/210;container-type:inline-size;overflow:hidden;direction:rtl;font-family:'Readex Pro','Tajawal','Segoe UI',Tahoma,sans-serif;color:#575757;background:#fff;border-radius:6px;box-shadow:0 4px 18px rgba(22,35,58,.15);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.mc-cert>img.mc-bg{position:absolute;inset:0;width:100%;height:100%;display:block;max-width:none}
.mc-cert>img.mc-stamp{position:absolute;left:42.5%;top:70%;width:15%;height:auto;max-width:none;transform:rotate(-8deg);opacity:.9;mix-blend-mode:multiply;z-index:2;pointer-events:none}
.mc-cert>div{position:absolute;left:0;right:0;text-align:center;z-index:1}
.mc-pre{top:36.4%;font-size:2.02cqw;font-weight:800;margin:0 16%}
.mc-cert [data-fs]{white-space:nowrap;overflow:hidden;display:block}.mc-name span{max-width:94%}.mc-sig b,.mc-sig span{max-width:100%}
.mc-name{top:44.2%;left:25%!important;right:25%!important;height:5.4%;display:flex;align-items:center;justify-content:center;font-size:2.38cqw;font-weight:800;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.18)}
.mc-body{top:53.3%;font-size:1.96cqw;font-weight:800;line-height:2.05;margin:0 17%}
.mc-date{font-size:1.37cqw;font-weight:700;color:#8A8A8A;line-height:1.6}
.mc-sig{top:79.4%;width:26%;display:flex;flex-direction:column;gap:.5cqw;font-size:1.78cqw;font-weight:800}
.mc-sig span{font-weight:700;min-height:1.2em}.mc-sig.r{right:13%!important;left:auto!important}.mc-sig.l{left:13%!important;right:auto!important}
.pc-btns{display:flex;gap:8px;margin-top:12px}.pc-btns button{flex:1;background:#1F6B54}.pc-btns button.ghost{background:#EEF3FB;color:#1F6B54}
#pc-print{display:none}
/* 🏆 شهادة الأوائل: القالب نفسه + إطار ذهبي وميدالية المركز وإكليل وشريط اسم بلون المركز */
.mc-cert.mc-top .mc-pre{margin:0 22%}
.mc-cert>.mc-frame{position:absolute;inset:1.5%;z-index:1;border:.55cqw solid transparent;border-radius:.9cqw;pointer-events:none;
  background:linear-gradient(135deg,#FCEFB4,#C9932E 30%,#FFF4C7 50%,#B8860B 70%,#F7E08A) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.mc-cert>.mc-frame2{position:absolute;inset:2.6%;z-index:1;border:.16cqw solid rgba(201,147,46,.55);border-radius:.6cqw;pointer-events:none}
.mc-cert>.mc-band{position:absolute;left:23.6%!important;right:23.6%!important;top:43.5%;height:6.4%;border-radius:99px;z-index:1;box-shadow:0 .25cqw .9cqw rgba(120,80,0,.25),inset 0 0 0 .22cqw rgba(255,255,255,.55)}
.mc-top.r1>.mc-band{background:linear-gradient(180deg,#FFF1A8,#F2C53D 45%,#C99419)}
.mc-top.r2>.mc-band{background:linear-gradient(180deg,#FFFFFF,#D9DFE6 45%,#9EA8B4)}
.mc-top.r3>.mc-band{background:linear-gradient(180deg,#FFD9B5,#E0955A 45%,#A9612C)}
.mc-top>.mc-name{color:#3B2A05!important;text-shadow:0 1px 0 rgba(255,255,255,.6)!important;z-index:2}
.mc-top.r2>.mc-name{color:#2D3540!important}.mc-top.r3>.mc-name{color:#3E1F08!important}
.mc-cert>img.mc-medal{position:absolute;left:6%;top:26.5%;width:14%;height:auto;max-width:none;z-index:2;filter:drop-shadow(0 .5cqw .7cqw rgba(0,0,0,.22))}
.mc-cert>img.mc-laurel{position:absolute;right:5.5%;top:27.5%;width:15.5%;height:auto;max-width:none;z-index:2}
.mc-cert>.mc-rank{position:absolute;right:5.5%!important;left:auto!important;top:27.5%;width:15.5%;height:21.9%;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1cqw;line-height:1.15}
.mc-rank small{font-size:1.15cqw;font-weight:700;color:#6E6E6E}.mc-rank b{font-size:2.6cqw;font-weight:900}
.mc-top.r1 .mc-rank b{color:#A87A0E}.mc-top.r2 .mc-rank b{color:#6B7684}.mc-top.r3 .mc-rank b{color:#9A5426}
.mc-cert>img.mc-spark{position:absolute;inset:0;width:100%;height:100%;max-width:none;z-index:1;pointer-events:none}
.pc-sec.top{border:2px solid #E9C46A;background:linear-gradient(180deg,#FFFBEB,#fff 40%)}
.pc-sec.top h2{color:#8A6110}
.mc-cert>.mc-pv{position:absolute;top:3.4%;left:3.4%!important;right:auto!important;z-index:4;background:#B91C1C;color:#fff;font-weight:800;font-size:1.3cqw;padding:.3cqw 1.2cqw;border-radius:99px;opacity:.92}
body.t3pv{background:#EEF2F7}body.t3pv>*:not(#t3pv){display:none!important}#t3pv{padding:10px}
@media print{
  @page{size:A4 landscape;margin:0}
  body.pc-printing>*:not(#pc-print){display:none!important}
  html:has(body.pc-printing),body.pc-printing{background:#fff!important;margin:0!important;padding:0!important;height:auto!important;min-height:0!important}
  body.pc-printing #pc-print{display:block!important;width:297mm;height:210mm;margin:0}
  body.pc-printing #pc-print .mc-cert{width:297mm;height:210mm;aspect-ratio:auto;border-radius:0;box-shadow:none}
}
/* 🔒 بلا تكبير بالغلط: النقر المزدوج لا يكبّر، وخانات الكتابة بخط 16px حتى لا يكبّر iPhone الصفحة عند الكتابة */
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
</style>

<body>
<header><b>👪 متابعة ولي الأمر لمستوى الطالب</b><small>درجات ابنكم في المادة أولًا بأول — للاطلاع فقط</small></header>
<main>
  <section class="card" id="login">
    <h2>الدخول</h2>
    <p class="muted" style="margin-top:0">اكتب اسم الطالب أو جزءًا منه واختر اسمه من الاقتراح، ثم رقم جوالكم المسجّل في المدرسة.</p>
    <form id="f" autocomplete="on">
      <label>اسم الطالب<input id="nm" name="student" required placeholder="مثال: محمد عبدالله العتيبي" autocomplete="off"></label>
      <div id="nmx" class="hide"></div>
      <label>جوال ولي الأمر<input id="ph" name="tel" type="tel" inputmode="numeric" required placeholder="05xxxxxxxx" dir="ltr"></label>
      <button type="submit" id="go">عرض التقرير</button>
      <div class="err hide" id="err"></div>
    </form>
  </section>
  <div id="out"></div>
</main>
<footer>أنشطتي · تطوير: المعلم أحمد المرزوق</footer>
<script>
const API='https://homework.ahmadalmarzooq2009.workers.dev';
const KEY='parent_login_v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const pct=(a,b)=>b?Math.round(a/b*100):0;
let PNAME='';
function err(t){ const e=$('err'); e.textContent=t; e.classList.toggle('hide',!t); }
async function go(name, phone, quiet, sp){
  err(''); $('go').disabled=true; $('go').textContent='⏳ جارٍ التحقق…';
  try{
    const r=await fetch(API+'/parent/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone,...(sp||{})})});
    const j=await r.json().catch(()=>({}));
    if(!j.ok){
      if(quiet){ $('login').classList.remove('hide'); return; }
      err(j.error==='locked'?'محاولات كثيرة غير صحيحة — حاول بعد ساعة.':r.status===404&&j.error==='no_match'?`الاسم أو رقم الجوال غير مطابق لبيانات المدرسة.${j.left!=null?` (متبقٍ ${j.left} محاولات)`:''}`:'تعذّر الاتصال — حاول لاحقًا.');
      return;
    }
    try{ localStorage.setItem(KEY,JSON.stringify({name,phone})); }catch(e){}
    $('login').classList.add('hide'); PNAME=name; render(j, phone);
  }catch(e){ err('تعذّر الاتصال — تحقق من الإنترنت.'); }
  finally{ $('go').disabled=false; $('go').textContent='عرض التقرير'; }
}
// 💡 اقتراح الاسم الصحيح مثل «أنشطتي»: يكتب جزءًا من الاسم ويختار اسمه الكامل بلمسة
let _nT=null;
const nmBox=(h)=>{ const x=$('nmx'); x.innerHTML=h||''; x.classList.toggle('hide',!h); };
$('nm').addEventListener('input',()=>{
  clearTimeout(_nT); const q=$('nm').value.trim();
  if(!q){ nmBox(''); return; }
  _nT=setTimeout(async()=>{
    try{
      const j=await (await fetch(API+'/find',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q})})).json();
      if(q!==$('nm').value.trim()) return;
      if(j.ok&&Array.isArray(j.matches)&&j.matches.length===1){
        const nm=j.matches[0].name||'';
        if(nm.trim()===q){ nmBox('<div class="hint">✅ الاسم صحيح</div>'); return; }
        nmBox(`<button type="button" class="pick" data-nm="${esc(nm)}"><small>هل تقصد؟ اضغط للتأكيد</small><b>${esc(nm)}</b></button>`);
        $('nmx').querySelector('.pick').onclick=e=>{ $('nm').value=e.currentTarget.dataset.nm; nmBox('<div class="hint">✅ الاسم صحيح</div>'); $('ph').focus(); };
      } else if(j.error==='many') nmBox(`<div class="hint">يوجد ${j.total||'أكثر من'} طلاب بهذا الاسم — أضف اسم الأب أو العائلة</div>`);
      else if(j.error==='none') nmBox('<div class="hint" style="color:var(--bad)">لم أجد اسمًا مطابقًا — ابدأ بالاسم الأول للطالب</div>');
      else nmBox('');
    }catch(e){ nmBox(''); }
  },300);
});
/* 🏅 شهادة التميّز: قالب شهادات الشكر نفسه (الخلفية، ونص المعلم وتوقيعاته كما ضبطها في اللوحة) */
const PC_BG='/cert-bg.jpg', PC_STAMP='/stamp.png';   // 🔵 ختم المدرسة على شهادة التميّز (تقدير «ممتاز»)
const PCS={};   // x: شهادة التميّز (ممتاز) · t: شهادة الأوائل
const ORD=['الأول','الثاني','الثالث'];
const METAL={1:['#FFF6C2','#F4C542','#C8961E','#7A5408'],2:['#FFFFFF','#E3E8EE','#A8B2BF','#5E6874'],3:['#FFE3C9','#E59E62','#B06A32','#6E3A14']};
/* 🥇 ميدالية بلون المركز (SVG واحد للشاشة والطباعة والصورة المحفوظة) */
function medalSVG(r){ const M=METAL[r]||METAL[1], n='١٢٣'[r-1]||'١'; let sc='';
  for(let i=0;i<20;i++){ const a=i/20*Math.PI*2; sc+=`<circle cx="${(100+74*Math.cos(a)).toFixed(1)}" cy="${(108+74*Math.sin(a)).toFixed(1)}" r="13" fill="url(#m)"/>`; }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250"><defs><linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${M[0]}"/><stop offset=".45" stop-color="${M[1]}"/><stop offset="1" stop-color="${M[2]}"/></linearGradient>
    <radialGradient id="c" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="${M[0]}"/><stop offset=".6" stop-color="${M[1]}"/><stop offset="1" stop-color="${M[2]}"/></radialGradient></defs>
    <path d="M62 150 L34 246 L62 228 L84 248 L104 160Z" fill="#0F8A7E"/><path d="M138 150 L166 246 L138 228 L116 248 L96 160Z" fill="#0B6B62"/>
    ${sc}<circle cx="100" cy="108" r="76" fill="url(#m)"/><circle cx="100" cy="108" r="60" fill="url(#c)" stroke="${M[3]}" stroke-opacity=".35" stroke-width="3"/>

      <div class="dk"><span>أنجز</span><b>${C.done}</b></div><div class="dk"><span>لم ينجز</span><b>${C.missed}</b></div>${C.forgiven?`<div class="dk"><span>🎫 عوّضه بنقاط تميّزه</span><b>${C.forgiven}</b></div>${(C.forgivenList||[]).length?`<p class="how">واجبات أيام: ${C.forgivenList.map(dayFmt).join('، ')}</p>`:''}`:''}
      ${C.missed?'<p class="tip">💡 تابعوا معه حلّ واجب الكتاب وإحضاره في الحصة التالية.</p><p class="tip">⭐ ما فاته يمكن تعويضه بنقاط التميّز التي يكسبها ابنكم من حلّ الأنشطة والمشاركة في البوابة — فكل نشاط يحلّه اليوم يساعده غدًا.</p>':''}`
      :`<h3>📕 الواجبات</h3>${why(H.score,H.max)}`; }
  if(R&&R.behavior){ const B=R.behavior, neg=(B.notes||[]).filter(n=>n.type!=='positive'), pos=(B.notes||[]).filter(n=>n.type==='positive');
    D.beh=`<h3>🤝 السلوك</h3>${why(B.score,B.max)}
      ${neg.length?`<p class="miss">ملاحظات سلبية (${neg.length}):</p>${li(neg.map(n=>`${esc(n.date)} — ${esc(n.category||'ملاحظة')}${n.note?`: ${esc(n.note)}`:''}`))}`:''}
      ${pos.length?`<p class="ok">🌟 مواقف إيجابية (${pos.length}):</p>${li(pos.map(n=>`${esc(n.date)} — ${esc(n.category||'')}${n.note?`: ${esc(n.note)}`:''}`))}`:''}`; }
  if(R&&R.exam){ const E=R.exam, T=(E.tests||[]);
    D.exam=`<h3>📝 الاختبارات</h3>${E.measured&&E.score!=null?why(E.score,E.max):'<p class="how">لم تُرصد درجات بعد.</p>'}
      ${T.length?`<div class="dt">${T.map(t=>{ const p=t.score==null?null:Math.round(t.score/t.max*100);
        return `<div class="dk${p!=null&&p<70?' low':''}"><span>${esc(t.title)}</span><b>${t.score==null?'لم يُرصد':`${t.score} من ${t.max}`}</b></div>`; }).join('')}</div>`:''}
      ${E.bonus>0?`<div class="dk" style="margin-top:8px"><span>مجموع درجاته في الاختبارات</span><b>${E.base!=null?+(+E.base).toFixed(2):+(E.score-E.bonus).toFixed(2)} من ${E.max}</b></div><div class="dk"><span>🎁 عوّضه بنقاط تميّزه</span><b style="color:var(--ok)" dir="ltr">+${+(+E.bonus).toFixed(2)}</b></div><div class="dk"><span>درجته النهائية في الاختبارات</span><b>${E.score} من ${E.max}</b></div>`:''}
      ${(()=>{ const w=T.filter(t=>t.score!=null&&t.score/t.max<0.7).sort((a,b)=>a.score/a.max-b.score/b.max)[0]; if(!w) return '';
        return `<p class="tip">💡 أقل درجاته في «${esc(w.title)}» (${w.score} من ${w.max}). نقترح مراجعة دروس هذا الاختبار معه${w.score/w.max<0.6?'، وستصله في البوابة مهمة علاجية بالأسئلة التي أخطأ فيها':''}.</p>`; })()}`; }
  if(A&&A.total){ const late=(A.missing||[]).filter(x=>x.late), op=(A.missing||[]).filter(x=>!x.late).sort((a,b)=>String(a.due||'9999').localeCompare(String(b.due||'9999')));
    D.acts=`<h3>💻 المهام الأدائية (أنشطة البوابة)</h3>${A.doneN>=A.total?ok('سلّم كل الأنشطة.'):`<p class="miss">لم يسلّم <b>${A.total-(A.doneN||0)}</b> من ${A.total}</p>`}
      ${op.length?`<p class="grp open">⏳ متاحة للحل الآن:</p>${li(op.map(x=>esc(x.t)+(x.due?closeTag(closeIn(x.due)):' <span class="tag ok">مفتوح</span>')))}
      <p class="tip">💡 يحلّها ابنكم من رابط «أنشطتي» قبل موعد الإغلاق — كل نشاط يسلّمه يرفع درجته.</p>`:''}
      ${late.length?`<p class="grp gone">انتهى وقتها:</p><ul class="gone">${late.map(x=>`<li>${esc(x.t)}</li>`).join('')}</ul><p class="tip">⭐ ما انتهى وقته يمكن فتحه من جديد بنقاط التميّز التي يكسبها ابنكم من حلّ الأنشطة والمشاركة في البوابة — فكل نشاط يحلّه اليوم يساعده غدًا.</p>`:''}`; }
  if(R&&R.homework&&R.homework.madrasati&&(R.homework.madrasati.counted||(R.homework.madrasati.pendingList||[]).length)){ const M=R.homework.madrasati;
    const MP=(M.pendingList||[]).slice().sort((a,b)=>(a.dueAt||9e15)-(b.dueAt||9e15)), unsolved=M.counted-M.solved+MP.length;
    D.mad=`<h3>📱 واجبات مدرستي</h3>${!unsolved?ok('حلّ كل واجبات مدرستي.'):`<p class="miss">لم يحلّ <b>${M.counted-M.solved}</b> من ${M.counted}${MP.length?` · ومتاح له ${MP.length} الآن`:''}</p>`}
      ${MP.length?`<p class="grp open">⏳ متاحة للحل الآن:</p>${li(MP.map(x=>esc(x.title)+(x.dueAt?closeTag(closeIn(x.dueAt)):closeTag({n:x.daysLeft,txt:`خلال ${x.daysLeft} ${x.daysLeft===1?'يوم':'أيام'}`}))))}
      <p class="tip">💡 يحلّها ابنكم من تطبيق مدرستي ← واجباتي، قبل موعد الإغلاق.</p>`:''}
      ${(M.missedList||[]).length?`<p class="grp gone">انتهى وقتها:</p><ul class="gone">${M.missedList.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p class="tip">⭐ ما فاته يمكن تعويضه بنقاط التميّز التي يكسبها ابنكم من حلّ الأنشطة والمشاركة في البوابة — فكل نشاط يحلّه اليوم يساعده غدًا.</p>`:''}
      ${M.forgiven?`<p class="grp" style="color:#6B4FB8">🎫 عوّضها بنقاط تميّزه (${M.forgiven}):</p>${(M.forgivenList||[]).length?`<ul>${M.forgivenList.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}`:''}`; }
  return D;
}
function render(j, phone){
  const CV=!!(j.view&&(j.periods||[]).find(x=>x.sem===j.view.sem&&x.per===j.view.per&&x.closed));
  const s=j.student, A=j.acts||{}, R=j.live||(j.reports||[])[0]||null, late=(A.missing||[]).filter(x=>x.late), open=(A.missing||[]).filter(x=>!x.late);
  // 🧮 مثل كشف الدرجات: أعمال السنة 40 (المشاركة 10 · الواجبات 10 · السلوك 10 · المهام الأدائية 10) + الاختبارات 20 = 60
  const n1=v=>Math.round((Number(v)||0)*10)/10, H=R&&R.homework||{}, C=H.classPart, M=H.madrasati;
  const AC=R&&R.activities&&R.activities.n!=null?R.activities:(A.total?{score:n1((A.doneN||0)/A.total*10),max:10,n:A.total,done:A.doneN||0}:null);
  const pS=R&&R.participation?n1(R.participation.score):0, hS=n1(H.score), bS=R&&R.behavior?n1(R.behavior.score):0, aS=AC?n1(AC.score):10;
  const work=n1(pS+hS+bS+aS), exOn=!!(R&&R.exam&&R.exam.measured&&R.exam.score!=null), exS=exOn?n1(R.exam.score):0, total=n1(work+exS);
  const level=t=>t>=54?['ممتاز','#13734F']:t>=48?['جيد جدًا','#1F7A5A']:t>=42?['جيد','#1F5FC8']:t>=30?['يحتاج متابعة','#B7791F']:['يحتاج دعم','#B4232F'];
  const out=exOn?total:work, max=exOn?60:40, LV=exOn?level(total):level(work*1.5), P=Math.round(out/max*100);
  // 📅 تبويب الفترة أعلى البطاقة: «الأولى · نهائية» و«الثانية · الآن» — ولا يُخفى خلف الدرجة
  const PS=j.periods||[], sameSem=PS.length&&PS.every(x=>x.sem===PS[0].sem), V=j.view||{};
  const pName=x=>(sameSem?'':(x.sem===2?'الفصل الثاني · ':'الفصل الأول · '))+(x.per===2?'الفترة الثانية':'الفترة الأولى');
  const tabs=PS.length>1?`<div class="ptabs" role="tablist" aria-label="اختر الفترة">${PS.map(x=>{ const on=x.sem===V.sem&&x.per===V.per;
      return `<button type="button" role="tab" aria-selected="${on}" class="ptab ${on?'on':''}" data-psp="${x.sem}:${x.per}"><b>${pName(x)}</b><small>${x.closed?'🔒 النتيجة النهائية':'⏳ الآن — مستمرة'}</small></button>`; }).join('')}</div>`:'';
  const lastClosed=PS.filter(x=>x.closed).sort((a,c)=>(c.closedAt||0)-(a.closedAt||0))[0];
  const nudge=!CV&&lastClosed?`<button type="button" class="pnudge" data-psp="${lastClosed.sem}:${lastClosed.per}">📄 صدرت النتيجة النهائية <b>لل${pName(lastClosed).slice(2)}</b> <span>اعرضها ←</span></button>`:'';
  let h=`<section class="card hero">${tabs}<div class="who"><div class="av">🎓</div><div style="flex:1;min-width:0"><b>${esc(s.name)}</b><div class="muted">الفصل ${esc(s.cls||'—')}${R?` · ${esc(R.label||'')}`:''}</div></div>
      <button class="ghost sm" type="button" id="out-btn">خروج</button></div>
    ${R?`<div class="lv" style="--c:${LV[1]}"><div class="ring" style="--p:${P}"><b>${out}<small>من ${max}</small></b></div><div><span class="muted">${exOn?(CV?'مجموعه في الفترة (مغلقة)':'مجموعه حتى الآن'):(CV?'أعمال السنة في الفترة':'أعمال السنة حتى الآن')+' (الاختبارات لم تُرصد)'}</span><div class="lv-t">${LV[0]}</div>
      <div class="sum"><span>📚 أعمال السنة <b>${work}</b> من 40</span><span>📝 الاختبارات <b>${exOn?exS:'—'}</b> من 20</span></div></div></div>`:''}
    ${nudge}
    ${(()=>{ const mp=(M&&M.pendingList)||[], n=open.length+mp.length; if(!n) return '';
      const cs=[...open.filter(x=>x.due).map(x=>closeIn(x.due)),...mp.map(x=>x.dueAt?closeIn(x.dueAt):{n:x.daysLeft,txt:`يُغلق خلال ${x.daysLeft} ${x.daysLeft===1?'يوم':'أيام'}`})].filter(Boolean).sort((a,b)=>a.n-b.n)[0];
      return `<p class="muted" style="margin:.6rem 0 0">⏳ لديه <b>${n}</b> ${n===1?'مهمة متاحة':'مهام متاحة'} للحل الآن${cs?` — أقربها ${esc(cs.txt)}`:''}. اضغط بطاقة «واجبات مدرستي» أو «المهام الأدائية» للتفاصيل.</p>`; })()}
    ${(j.siblings||[]).length?`<div class="sib"><span class="muted">إخوته:</span>${j.siblings.map(n=>`<button class="ghost sm" type="button" data-sib="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:''}</section>`;
  // 🏅 شهادة تلقائية لمن بلغ تقدير «ممتاز» — تظهر وتختفي مع المستوى الحي، وتُطبع أو تُحفظ PDF
  Object.keys(PCS).forEach(k=>delete PCS[k]);
  h+=top3HTML(s, j);
  // 🏅 الشهادة على النتيجة الكاملة من 60 فقط: لا تصدر قبل رصد الاختبار (أعمال السنة وحدها من 40 لا تكفي)
  if(R && exOn && LV[0]==='ممتاز') h+=certHTML(s, R, j, exOn, out, max);
  if(R){
    h+=`<section class="card"><h2>📚 أعمال السنة <span class="h-sc">${work} من 40</span></h2><p class="muted" style="margin:-.3rem 0 .7rem">اضغط أي بطاقة لمعرفة سبب درجتها.</p><div class="tiles">
      ${bar('المشاركة',pS,10,R.participation&&R.participation.absent?`غاب ${R.participation.absent} ${R.participation.absent===1?'حصة':'حصص'}`:'','🙋','part')}
      ${bar('السلوك',bS,10,`🌟 ${R.behavior&&R.behavior.pos||0} إيجابي · ⚠️ ${R.behavior&&R.behavior.neg||0} سلبي`,'🤝','beh')}
      ${C&&C.max?bar('واجبات الفصل',n1(C.score),C.max,`أنجز ${C.done||0} · لم ينجز ${C.missed||0}${C.forgiven?` · 🎫 عوّض ${C.forgiven}`:''}`,'📕','hw'):''}
      ${M&&M.max?bar('واجبات مدرستي',n1(M.score),M.max,(M.counted?`حلّ ${M.solved} من ${M.counted}`:'لا واجبات بعد')+(M.forgiven?` · 🎫 عوّض ${M.forgiven}`:''),'📱','mad'):''}
      ${!(C&&C.max)&&!(M&&M.max)?bar('الواجبات',hS,10,'','📕','hw'):''}
      ${bar('المهام الأدائية',aS,10,AC?`سلّم ${AC.done} من ${AC.n} من أنشطة البوابة`:'','💻','acts')}
    </div></section>
    <section class="card"><h2>📝 الاختبارات <span class="h-sc">${exOn?exS:'—'} من 20</span></h2><div class="tiles">
      ${exOn?bar('الاختبارات',exS,20,(R.exam.tests||[]).filter(t=>t.score!=null).map(t=>`${esc(t.title)}: ${t.score} من ${t.max}`).join(' · ')+(R.exam.bonus>0?` · 🎁 +${+(+R.exam.bonus).toFixed(2)} بنقاط التميّز`:''),'📝','exam'):`<div class="tile none"><div class="t-top"><span class="t-ic">📝</span><span class="t-nm">الاختبارات</span></div><span class="t-sub">لم تُرصد درجات بعد</span></div>`}
    </div><div id="det" class="det hide"></div>${R.teacherNote?`<p class="note" style="margin-top:12px">📝 <b>ملاحظة المعلم:</b> ${esc(R.teacherNote)}</p>`:''}</section>`;
  }
  const W=j.weekly&&j.weekly.d;
  if(W&&((W.ps||[]).length||(W.ng||[]).length||W.st)) h+=`<section class="card"><h2>🗓️ آخر أسبوع</h2>
      ${(W.ps||[]).length?`<p class="pt">🌟 <b>أحسن في:</b> ${W.ps.map(esc).join('، ')}</p>`:''}
      ${(W.ng||[]).length?`<p class="pt">📌 <b>يحتاج انتباهًا إلى:</b> ${W.ng.map(esc).join('، ')}</p>`:''}
      ${W.st?`<p class="note">🎯 خطوته القادمة: ${esc(W.st)}</p>`:''}</section>`;
  $('out').innerHTML=h;
  if(Object.keys(PCS).length){ requestAnimationFrame(()=>pcFit($('out'))); $('out').querySelectorAll('.mc-bg').forEach(im=>im.onload=()=>pcFit($('out'))); setTimeout(()=>pcPrepare().catch(()=>{}),600); }
  const DET=parentDetails(R, A);
  $('out').querySelectorAll('.tile[data-k]').forEach(t=>{ const open=()=>{ const d=$('det'), k=t.dataset.k, was=t.classList.contains('on');
      $('out').querySelectorAll('.tile.on').forEach(x=>x.classList.remove('on'));
      if(was){ d.classList.add('hide'); return; }
      t.classList.add('on'); t.closest('section').appendChild(d); d.style.setProperty('--c', getComputedStyle(t).getPropertyValue('--c')); d.innerHTML=DET[k]||''; d.classList.remove('hide'); d.scrollIntoView({behavior:'smooth',block:'nearest'}); };
    t.onclick=open; t.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } }; });
  $('out-btn').onclick=()=>{ try{ localStorage.removeItem(KEY); }catch(e){} $('out').innerHTML=''; $('login').classList.remove('hide'); };
  $('out').querySelectorAll('[data-sib]').forEach(b=>b.onclick=()=>go(b.dataset.sib, phone));
  // 📅 فترة أخرى (مثل الفترة الأولى بعد إغلاقها): نفس التقرير بدرجاتها كما أُغلقت
  $('out').querySelectorAll('[data-psp]').forEach(b=>b.onclick=()=>{ const [sem,per]=b.dataset.psp.split(':').map(Number); b.disabled=true; go(PNAME||(JSON.parse(localStorage.getItem(KEY)||'{}').name||''), phone, false, {sem,per}); });
}
$('f').onsubmit=e=>{ e.preventDefault(); go($('nm').value.trim(), $('ph').value.trim()); };
try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&s.name&&s.phone){ $('nm').value=s.name; $('ph').value=s.phone; $('login').classList.add('hide'); go(s.name,s.phone,true); } }catch(e){}
</script>
