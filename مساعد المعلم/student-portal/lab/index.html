/* =========================================================
   🚗 تجربة القصور الذاتي
   الجزء الأول: عربة وراكب تصطدم بحاجز (حزام الأمان).
   الجزء الثاني: الدفعة نفسها لعربات مختلفة الكتلة على مسار شبه عديم الاحتكاك،
   وبوابتان ضوئيتان تقيسان زمن قطع متر واحد. v = F × 0.25 s ÷ m
   ========================================================= */
const IN={PT:0.25,G1:0.6,G2:1.6,END:2.3,BAR:1.2,CART:0.5,W:0.5,forces:[2,4,6,8],mu:0.35,beltF:4,beltM:1.0};
const inV=(F,m)=>F*IN.PT/m;
const inT=(F,m)=>(IN.G2-IN.G1)/inV(F,m);
const kg=m=>(Math.round(m*10)/10).toFixed(1);

const INSIM=(()=>{
  const W=800,XS=720,S=280,CW=.24*S,CH=21,WR=8;
  let cv,c,raf=0,last=0,col={},L=[],mode='gates',onEvent=null,opt={};
  const prand=i=>{const x=Math.sin(i*91.7+17.3)*43758.5453;return x-Math.floor(x)};
  function readColors(){const cs=getComputedStyle(document.documentElement);
    col={ink:cs.getPropertyValue('--ink').trim()||'#13324A',ink2:cs.getPropertyValue('--ink-2').trim()||'#4F6879',
      paper:cs.getPropertyValue('--paper').trim()||'#fff',bad:cs.getPropertyValue('--bad').trim()||'#C3473E',
      glass:cs.getPropertyValue('--glass').trim()||'#4FB3C8',ok:cs.getPropertyValue('--ok').trim()||'#1E8A5C',amber:cs.getPropertyValue('--amber').trim()||'#D98E1F'}}
  const LH=()=>150;
  const yb=i=>8+i*LH()+LH()-36;
  function mount(canvas,m,lanes,o,ev){
    cancelAnimationFrame(raf);PT=[];cv=canvas;c=cv.getContext('2d');mode=m;opt=o||{};onEvent=ev;
    L=lanes.map(x=>Object.assign({phase:'ready',x:0,v:0,t:0,F:null,g1:null,g2:null,timer:0,px:0,py:0,pv:0,pvy:0,pstate:'on'},x));
    const H=8+lanes.length*LH()+4,dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=W*dpr;cv.height=H*dpr;cv.style.aspectRatio=`${W}/${H}`;c.setTransform(dpr,0,0,dpr,0,0);
    readColors();last=performance.now();raf=requestAnimationFrame(loop);
  }
  function stop(){cancelAnimationFrame(raf)}
  function release(i,F){const l=L[i];if(!l||!(l.phase==='ready'||l.phase==='done'))return false;
    Object.assign(l,{phase:'push',x:0,v:0,t:0,F,g1:null,g2:null,timer:0,px:0,py:0,pv:0,pvy:0,pstate:'on',pd:0,_v:null});return true}
  function reset(i){const l=L[i];if(l)Object.assign(l,{phase:'ready',x:0,v:0,t:0,g1:null,g2:null,timer:0,px:0,py:0,pstate:'on',_v:null})}
  function laneAt(px,py){const H=LH();const i=Math.floor((py-8)/H);return i>=0&&i<L.length?i:-1}
  function toCanvas(cx_,cy_){const r=cv.getBoundingClientRect();const H=cv.height/Math.min(2,window.devicePixelRatio||1);return {x:(cx_-r.left)*W/r.width,y:(cy_-r.top)*H/r.height}}
  function stepLane(l,i,dt){
    const m=l.m;
    if(l.phase==='push'){const a=l.F/m;l.t+=dt;const tp=Math.min(l.t,IN.PT);l.v=a*tp;l.x=.5*a*tp*tp;if(l.t>=IN.PT){l.phase='coast';l.v=inV(l.F,m)}}
    else if(l.phase==='coast'){l.t+=dt;l.x+=l.v*dt;}
    else return;
    if(mode==='gates'){
      if(l.g1===null&&l.x>=IN.G1){l.g1=l.t-(l.x-IN.G1)/l.v}
      if(l.g1!==null&&l.g2===null){l.timer=l.t-l.g1;if(l.x>=IN.G2){l.g2=l.g1+(IN.G2-IN.G1)/l.v;l.timer=l.g2-l.g1;onEvent&&onEvent('timer',i,{t:l.timer})}}
      if(l.x>=IN.END){l.x=IN.END;l.v=0;l.phase='done';onEvent&&onEvent('done',i,{})}
      onEvent&&onEvent('pos',i,XS-l.x*S);
    }else{
      // الحاجز: تتوقف العربة فجأة عند BAR (مقدمة العربة)
      if(l.x>=IN.BAR-.16){l.x=IN.BAR-.16;const v=l.v;l.v=0;l.phase='hit';l.pv=l.belt?0:v;l.pstate=l.belt?'held':'slide';l.ht=0;onEvent&&onEvent('hit',i,{v})}
      onEvent&&onEvent('pos',i,XS-l.x*S);
    }
  }
  function stepPassenger(l,i,dt){
    if(l.phase!=='hit')return;
    l.ht+=dt;
    if(l.pstate==='held'){if(l.ht>.6){l.phase='done';onEvent&&onEvent('done',i,{belt:true,d:0})}return}
    const top=.16;   // طول سطح العربة
    if(l.pstate==='slide'){l.px+=l.pv*dt;if(l.px>=top-.02){l.pstate='fly';l.pvy=0}}
    else if(l.pstate==='fly'){l.px+=l.pv*dt;l.pvy+=9.8*dt;l.py+=l.pvy*dt;if(l.py>=.075){l.py=.075;l.pstate='ground'}}
    else if(l.pstate==='ground'){l.pv-=IN.mu*9.8*dt;if(l.pv<=0){l.pv=0;l.pstate='rest';l.phase='done';onEvent&&onEvent('done',i,{belt:false,d:l.px})}else l.px+=l.pv*dt}
  }
  /* ===== رسم واقعي: طاولة مختبر، مسار ألومنيوم، عربة بتعليق نابضي وعجلات تدور، دمية تصادم، اهتزاز ووميض عند الاصطدام، بوابات ضوئية متوهجة ===== */
  let PT=[],TT=0,dark=false;
  const VS=l=>l._v||(l._v={pv:0,th:0,thv:0,bz:0,bzv:0,sh:0,ps:'on',flash:0,bw:0,ht:0});
  const isDark=()=>false;
  function puff(x,y,n,cl,vx,up,g){for(let k=0;k<n;k++){const life=.35+Math.random()*.55;PT.push({x,y:y-1,vx:(vx||0)*(.3+Math.random()*.7)+(Math.random()-.5)*40,vy:-(up||25)*(.3+Math.random()),life,max:life,r:1+Math.random()*2.6,cl,g:g==null?40:g})}}
  function sparks(x,y,n){for(let k=0;k<n;k++){const a=-Math.PI/2+(Math.random()-.3)*1.9,sp=60+Math.random()*160,life=.25+Math.random()*.35;
    PT.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life,max:life,r:1+Math.random()*1.6,cl:Math.random()<.5?'#FFD45C':'#FF8A3D',g:420,spark:1})}}
  /* تأثيرات بصرية فقط: تعليق العربة، الاهتزاز، الغبار — لا تغيّر الفيزياء ولا القياسات */
  function fx(dt){TT+=dt;
    L.forEach((l,i)=>{const s=VS(l),y=yb(i),cx=XS-l.x*S;
      const dv=l.v-s.pv;s.pv=l.v;
      s.thv+=Math.max(-2.2,Math.min(2.2,dv*1.1));
      if(dv<-.35){const imp=-dv,ix=cx-CW/2;s.sh=Math.min(7,imp*3.4);s.bzv-=Math.min(60,imp*26);s.flash=1;s.bw=Math.min(1.5,imp);s.ht=TT;
        sparks(ix,y-16,Math.round(8+imp*7));puff(ix,y,10,dark?'rgba(200,210,220,.7)':'rgba(120,110,95,.6)',40,20)}
      s.thv+=(-260*s.th-13*s.thv)*dt;s.th+=s.thv*dt;
      s.bzv+=(-420*s.bz-15*s.bzv)*dt;s.bz+=s.bzv*dt;
      s.sh*=Math.exp(-dt*9);s.flash*=Math.exp(-dt*7);s.bw*=Math.exp(-dt*4);
      if(mode==='belt'&&!l.belt){const px=cx-l.px*S;
        if(s.ps==='fly'&&(l.pstate==='ground'||l.pstate==='rest'))puff(px-6,y,16,'rgba(150,105,70,.75)',-l.pv*S*.6,30);
        if(l.pstate==='ground'&&Math.random()<.7)puff(px-10,y,1,'rgba(150,105,70,.7)',-60,14);
        s.ps=l.pstate}
    });
    PT.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=Math.exp(-dt*(p.spark?1:3))});PT=PT.filter(p=>p.life>0);
  }
  function rr(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
  function pill(x,y,t,bg,fg,fs){c.save();c.font=`700 ${fs||12}px "IBM Plex Sans Arabic",sans-serif`;c.direction='rtl';const w=c.measureText(arNum(t)).width+18;c.fillStyle=bg;rr(x-w/2,y-11,w,22,11);c.fill();
    c.strokeStyle='rgba(0,0,0,.08)';c.lineWidth=1;c.stroke();c.fillStyle=fg||'#fff';c.textAlign='center';c.fillText(t,x,y+4);c.restore()}
  function arrow(x0,y0,x1,y1,color,label,lp){const a=Math.atan2(y1-y0,x1-x0);if(Math.hypot(x1-x0,y1-y0)<4)return;c.save();c.strokeStyle=color;c.fillStyle=color;c.lineWidth=3.4;c.lineCap='round';
    c.beginPath();c.moveTo(x0,y0);c.lineTo(x1-8*Math.cos(a),y1-8*Math.sin(a));c.stroke();c.beginPath();c.moveTo(x1,y1);c.lineTo(x1-12*Math.cos(a-.45),y1-12*Math.sin(a-.45));c.lineTo(x1-12*Math.cos(a+.45),y1-12*Math.sin(a+.45));c.closePath();c.fill();
    if(label){c.font='700 11px "IBM Plex Sans Arabic",sans-serif';c.direction='rtl';if(lp==='b'){c.restore();pill((x0+x1)/2,y0+44,label,color);return}if(lp==='r'){c.textAlign='left';c.fillText(label,x1+6,y1+4)}else{c.textAlign='center';c.fillText(label,(x0+x1)/2,y0-8)}}c.restore()}
  /* طاولة المختبر تحت المسار */
  function bench(y){
    c.fillStyle=dark?'rgba(0,0,0,.25)':'rgba(40,60,80,.10)';c.fillRect(0,y-10,W,17);
    const tt=c.createLinearGradient(0,y+5,0,y+11);tt.addColorStop(0,dark?'#4B5D6E':'#E4EBF0');tt.addColorStop(1,dark?'#3A4A59':'#C9D4DC');c.fillStyle=tt;c.fillRect(0,y+5,W,6);
    const fe=c.createLinearGradient(0,y+11,0,y+34);fe.addColorStop(0,dark?'#5B4632':'#B98A5A');fe.addColorStop(1,dark?'#3E2F21':'#8E6440');c.fillStyle=fe;c.fillRect(0,y+11,W,23);
    c.strokeStyle=dark?'rgba(0,0,0,.3)':'rgba(90,55,25,.25)';c.lineWidth=.8;for(let k=0;k<3;k++){c.beginPath();for(let x=0;x<=W;x+=8)c.lineTo(x,y+16+k*6+Math.sin(x*.03+k*2)*1.2);c.stroke()}
    c.fillStyle='rgba(255,255,255,.18)';c.fillRect(0,y+11,W,1);c.fillStyle='rgba(0,0,0,.25)';c.fillRect(0,y+33,W,1.5)}
  function rail(x0,x1,y,carpetTo){
    c.fillStyle='rgba(0,0,0,.18)';c.fillRect(x0+2,y+7,x1-x0,3);
    c.fillStyle='#2F3A43';[x0+6,x1-14].forEach(x=>{rr(x,y+5,10,6,1.5);c.fill()});
    const g=c.createLinearGradient(0,y,0,y+7);g.addColorStop(0,'#F4F7F9');g.addColorStop(.35,'#C7D1D8');g.addColorStop(.7,'#9AA8B3');g.addColorStop(1,'#7D8B96');c.fillStyle=g;c.fillRect(x0,y,x1-x0,7);
    c.fillStyle='rgba(60,75,85,.35)';c.fillRect(x0,y+3,x1-x0,1);c.fillStyle='rgba(255,255,255,.9)';c.fillRect(x0,y,x1-x0,1);
    c.strokeStyle='#62717C';c.lineWidth=1;c.strokeRect(x0,y,x1-x0,7);
    if(carpetTo){const cw=carpetTo-x0;const cg=c.createLinearGradient(0,y-2,0,y+7);cg.addColorStop(0,'#B07A55');cg.addColorStop(1,'#7E5236');c.fillStyle=cg;rr(x0,y-2,cw,9,2);c.fill();
      for(let k=0;k<260;k++){c.fillStyle=k%3?'rgba(70,35,15,.45)':'rgba(230,190,150,.45)';c.fillRect(x0+prand(k)*cw,y-2+prand(k+77)*9,1.4,1.4)}
      c.fillStyle='rgba(255,230,200,.35)';c.fillRect(x0,y-2,cw,1);
      c.strokeStyle='#C9A27E';c.lineWidth=1;for(let yy=y;yy<y+7;yy+=2){c.beginPath();c.moveTo(x0,yy);c.lineTo(x0-4,yy+1);c.stroke()}}
  }
  function wheel(x,y,ang){
    c.fillStyle='#161D23';c.beginPath();c.arc(x,y,WR,0,7);c.fill();
    c.strokeStyle='#39444D';c.lineWidth=1.4;for(let k=0;k<10;k++){const a=ang+k*.628;c.beginPath();c.moveTo(x+Math.cos(a)*WR*.8,y+Math.sin(a)*WR*.8);c.lineTo(x+Math.cos(a)*WR*.98,y+Math.sin(a)*WR*.98);c.stroke()}
    const rg=c.createRadialGradient(x-1.5,y-1.5,.5,x,y,WR*.62);rg.addColorStop(0,'#F4F7F9');rg.addColorStop(1,'#8E9AA4');c.fillStyle=rg;c.beginPath();c.arc(x,y,WR*.62,0,7);c.fill();
    c.strokeStyle='#4B5862';c.lineWidth=1.3;for(let k=0;k<5;k++){const a=ang+k*1.2566;c.beginPath();c.moveTo(x+Math.cos(a)*1.6,y+Math.sin(a)*1.6);c.lineTo(x+Math.cos(a)*WR*.58,y+Math.sin(a)*WR*.58);c.stroke()}
    c.fillStyle='#2B353D';c.beginPath();c.arc(x,y,1.8,0,7);c.fill()}
  function coil(x,y0,y1,w){c.strokeStyle='#9AA6AF';c.lineWidth=1.6;c.beginPath();const n=5;for(let k=0;k<=n*2;k++){const yy=y0+(y1-y0)*k/(n*2),xx=x+(k%2?w:-w)*(k>0&&k<n*2?1:0);k?c.lineTo(xx,yy):c.moveTo(xx,yy)}c.stroke()}
  /* جسم العربة في إحداثياتها المحلية (المحور عند منتصف المحورين) */
  const BOT=-7,TOPL=BOT-CH;
  function cartBody(m,showW,belt){
    c.fillStyle='#1F272E';rr(-CW/2-6,BOT-15,7,11,2);c.fill(); // مصد مطاطي أمامي
    c.fillStyle='#46525C';rr(CW/2-1,BOT-16,5,13,1.5);c.fill();  // صفيحة الدفع الخلفية

       explain:`القوة واحدة (والمسار شبه عديم الاحتكاك)، والذي تغيّر هو الكتلة فقط. الكتلة مقياس للقصور الذاتي: كلما زادت قاوم الجسم التغيير في حركته أكثر. وحسب القانون الثاني لنيوتن: التسارع = القوة ÷ الكتلة (ت = ق ÷ ك)، فبقوة 4 N يكون تسارع العربة 0.5 kg هو 8 m/s²، وتسارع العربة 1.5 kg هو 2.7 m/s² فقط.`},
      {type:'mcq',concept:'belt',prompt:'لماذا اندفع الراكب غير المربوط إلى الأمام عندما توقفت العربة فجأة؟',

       hints:['قبل الاصطدام: هل كان الراكب ساكنًا أم متحركًا مع العربة؟','الحاجز أثّر في العربة. هل أثّر في الراكب غير المربوط؟'],

    ];
  },
  apply(){

      options:[{t:'تتحرك السجادة فجأة ويبقى الغبار في مكانه بسبب قصوره الذاتي فينفصل عنها',ok:1},{t:'العصا تضرب الغبار مباشرة فيسقط'},{t:'الضربة تجعل الغبار أثقل'},{t:'الهواء يدفع الغبار للخارج'}],

      explain:'الضربة تحرّك السجادة فجأة، والغبار الساكن يميل للبقاء ساكنًا بسبب قصوره الذاتي، فتتحرك السجادة من تحته وينفصل ويسقط.'};
  },
  learned(c,r){
    const F=r&&r.inr?r.inr.Ff:4;
    return {
      lead:'القصور الذاتي هو ميل الجسم لمقاومة أي تغيير في حالته الحركية: المتحرك يميل للاستمرار في حركته، والساكن يميل للبقاء ساكنًا. وكلما زادت كتلة الجسم زاد قصوره الذاتي.',
      happened:`في الجزء الأول توقفت العربة عند الحاجز، والراكب غير المربوط استمر في حركته إلى الأمام، أما المربوط فأوقفه الحزام. في الجزء الثاني دفعت العربات الثلاث بالقوة نفسها (${F} N لمدة 0.25 s)، فاكتسبت العربة 0.5 kg سرعة ${inV(F,.5).toFixed(2)} m/s، والعربة 1.0 kg سرعة ${inV(F,1).toFixed(2)} m/s، والعربة 1.5 kg سرعة ${inV(F,1.5).toFixed(2)} m/s.`,
      why:`القانون الأول لنيوتن: يبقى الجسم على حالته من السكون أو الحركة بسرعة ثابتة ما لم تؤثر فيه قوة غير متزنة. الحاجز أثّر في العربة لا في الراكب، فاستمر الراكب في حركته. والقانون الثاني: التسارع = القوة ÷ الكتلة (ت = ق ÷ ك)، فالقوة نفسها تغيّر حركة الجسم الأثقل بمقدار أقل؛ لهذا نقول إن الكتلة مقياس للقصور الذاتي.`,
      concept:'القصور الذاتي: ميل الجسم لمقاومة التغيير في حالته الحركية، ويزداد بزيادة كتلته.'

  },
  score(r){
    const f=a=>a&&a.correct?[0,1,.6,.3][a.attempts]:0,q=r.answers,x=r.inr;
    const unfair=x.runs.filter(z=>z.F!==x.Ff).length;
    const calc=x.lanes.reduce((s,l)=>{const v=inV(x.Ff,l.m),m=l.calc||[];return s+(m.length&&Math.abs(m[0]-v)<=.05?5:m.some(y=>Math.abs(y-v)<=.05)?3:0)},0);
    const beltPts=(x.belt.includes('off')?5:0)+(x.belt.includes('on')?5:0);

      ['دقة حساب السرعة',calc,15],
      ['دقة الملاحظة',15*r.obsScore,15],
      ['الإجابات',10*f(q[0])+10*f(q[2]),20],
      ['تفسير النتيجة',10*f(q[1]),10],
      ['التحدي العملي',tries?[0,10,7,4][Math.min(3,tries)]:0,10],
      ['التطبيق في موقف جديد',10*f(q[3]),10]
    ];
    const total=Math.round(parts.reduce((a,p)=>a+p[1],0));
    const byC={};
    q.forEach(a=>{if(!a)return;const ok=a.correct&&a.attempts===1;byC[a.concept]=byC[a.concept]===undefined?ok:byC[a.concept]&&ok});
    byC.obs=r.obsScore>=.8;byC.fair=unfair===0;byC.calc=calc===15;byC.newton2=tries===1;
    return {parts,total,mastered:Object.keys(byC).filter(k=>byC[k]),reinforce:Object.keys(byC).filter(k=>!byC[k])};
  },
  log(r){const x=r.inr;
    return {topic:'inertia',belt:x.belt.slice(0,10),runs:x.runs.slice(0,30),lanes:x.lanes.map(l=>({m:l.m,calc:(l.calc||[]).slice(0,3)})),
      answers:r.answers.map(a=>({a:a&&a.log||[]})),obs:r.obs,chal:(r.chal||[]).slice(0,10),mistakes:r.log.slice(0,15)}},
  next(){return 'جرّب في التدريب الحر: ما الدفعة التي تجعل العربة 1.5 kg بسرعة العربة 0.5 kg؟ وماذا يحدث للراكب لو زادت سرعة العربة؟'},
  record(r){const x=r.inr;return {title:`${this.title}: دفعة ${x.Ff} N`,materials:['عربة 0.5 kg','أثقال 0.5 kg','راكب','حاجز','بوابتان ضوئيتان'],
    result:x.lanes.map(l=>`${kg(l.m)} kg ← ${inV(x.Ff,l.m).toFixed(2)} m/s`).join('، '),
    separation:x.lanes.map(l=>`${kg(l.m)} kg: حسب ${l.calc&&l.calc.length?l.calc[l.calc.length-1].toFixed(2):'—'} m/s`)}}
};

function inMassChanged(i){

function inPush(i){
  const r=APP.run,L=r.inr.lanes[i];if(r.step!=='mass')return;

  if(others.some(x=>x.F!==r.inF)){r.mist.exec++;r.log.push(`دفع العربة بقوة مختلفة (${r.inF} N) عن بقية العربات`);
    note(`انتبه: دفعت هذه العربة بقوة ${r.inF} N والعربات الأخرى بقوة مختلفة. هل تبقى المقارنة عادلة؟`,true)}
  if(!INSIM.release(i,r.inF))return note('انتظر حتى تتوقف العربة.');
  Object.assign(L,{ran:true,done:false,calc:[],rec:false,F:r.inF,t:null});r.inr.runs.push({m:L.m,F:r.inF});

function inTimer(i,res){const L=APP.run.inr.lanes[i];L.t=res.t;L.done=true;$('#it'+i).textContent=`${res.t.toFixed(2)} s`;$('#iv'+i).disabled=false;$('#irec'+i).disabled=false}
function inRecord(i){
  const r=APP.run,L=r.inr.lanes[i];if(!L.done||L.rec)return;

  inGuide();

function wkMount(id,mode){WK_CV=id;const v=wkView;Object.assign(v,{mode:mode||'pull',x:0,tx:0,F:0,Fs:0,d:0,active:false,drag:false,onEnd:null,done:false,held:false});

function wkGo(mode){

  if(i===1&&a.rec&&(F!==a.F||d===a.d)){ok=false;why=`في السحبة (ب) غيّر المسافة فقط: اجعل القوة ${a.F} N كما في (أ)، واختر مسافة غير ${fx1(a.d)} m.`}

function wkRecord(i){

  learned(c,r){return {

/* ---- مشهد الرافعة: اسحب الميزان إلى أسفل حتى يرتفع الحمل ---- */
const LV={cx:300,cy:112,PX:150,G:275};
const lvView={d:.5,load:MC.load,need:60,cap:70,F:0,Fs:0,ang:-.13,active:false,drag:false,held:false,done:false,ok:false,fail:false,onEnd:null,y0:0,pull:0,settle:0};

  v.Fs+=(v.F-v.Fs)*Math.min(1,dt*12);
  const tgt=v.ok||v.done?.04:-.13+(v.Fs/v.need)*.025;v.ang+=(tgt-v.ang)*Math.min(1,dt*5);

  c.fillStyle=g;c.beginPath();c.moveTo(cx,cy+6);c.lineTo(cx-34,G);c.lineTo(cx+34,G);c.closePath();c.fill();WMD.shadow(c,cx,G+2,80);

  const bg2=c.createLinearGradient(0,-9,0,9);bg2.addColorStop(0,'#D2A06A');bg2.addColorStop(1,'#A8743F');c.fillStyle=bg2;WMD.rr(c,-.5*PX-48,-9,.5*PX+48+1.62*PX,18,5);c.fill();
  c.strokeStyle='#6E4A26';c.lineWidth=1.5;c.stroke();c.strokeStyle='rgba(110,74,38,.35)';c.beginPath();c.moveTo(-.5*PX-40,-2);c.lineTo(1.55*PX,-3);c.moveTo(-.5*PX-30,4);c.lineTo(1.5*PX,3);c.stroke();

  // سهم وزن الحمل

function lvMount(id,load){const v=lvView;Object.assign(v,{load,F:0,Fs:0,pull:0,ang:-.13,active:false,drag:false,held:false,done:false,ok:false,fail:false,onEnd:null});

  WMSIM.mount($(id),800,300,lvDraw,{
    hit(p){const r=lvRing(),h=lvHook();if(Math.hypot(p.x-r.x,p.y-r.y)<50||(Math.abs(p.x-h.x)<26&&p.y>h.y&&p.y<r.y))return true;
      if(!v.active)for(const m of MC.arms){const mx=LV.cx+Math.cos(v.ang)*m*LV.PX,my=LV.cy+Math.sin(v.ang)*m*LV.PX;if(Math.hypot(p.x-mx,p.y-my)<22)return true}return false},
    down(p){const r=lvRing();
      if(!v.active)for(const m of MC.arms){const mx=LV.cx+Math.cos(v.ang)*m*LV.PX,my=LV.cy+Math.sin(v.ang)*m*LV.PX;if(Math.hypot(p.x-mx,p.y-my)<22){LVH.pick&&LVH.pick(m);return}}
      if(v.active&&v.drag){v.held=true;v.base=v.pull;return}
      if(!v.active&&LVH.grab&&LVH.grab()){v.held=true;v.base=0}},
    move(p,dl){if(v.active&&v.drag&&v.held&&!v.ok){v.pull=Math.max(0,Math.min(70,v.base+dl.dy))}},
    up(){if(!(v.active&&v.drag))return;v.held=false;
      if(!v.ok&&v.F>=v.cap-1e-9){v.active=false;v.fail=true;const f=v.onEnd;v.onEnd=null;setTimeout(()=>{f&&f(false,v.need)},350)}}});
  setTimeout(()=>frFollowEl(id,430),0);
}
function lvSetD(d){const v=lvView;if(v.active)return;Object.assign(v,{d,need:v.load*MC.la/d,F:0,pull:0,done:false,ok:false,fail:false})}
function lvStart(d,cap,onEnd,drag){const v=lvView;Object.assign(v,{d,need:v.load*MC.la/d,cap:cap||70,F:0,pull:0,active:true,drag:!!drag,held:!!drag,done:false,ok:false,fail:false,onEnd});
  if(!drag){const top=Math.min(v.need,v.cap);WMSIM.animate(1400,k=>{v.F=top*k;v.pull=v.F/1.15},()=>{if(v.need>v.cap+1e-9){v.active=false;v.fail=true;const f=v.onEnd;v.onEnd=null;setTimeout(()=>f&&f(false,v.need),350)}})}}
function lvPull(d,maxF,onEnd){lvStart(d,maxF||70,onEnd,false)}

const RP={G:262,x1:590,PX:220};

    hit(p){const b=rpBox();return Math.hypot(p.x-b.x,p.y-(b.y-23))<48},
    down(p){if(v.active&&v.drag){v.held=true;v.base=v.s;return}if(!v.active&&RPH.grab&&RPH.grab()){v.held=true;v.base=0}},
    move(p,dl){if(!(v.active&&v.drag&&v.held))return;const g=rpGeom();let s;
      if(g.vert)s=v.base-dl.dy/g.h;else s=v.base+(dl.dx*Math.cos(g.ang)-dl.dy*Math.sin(g.ang))/g.Lp;
      v.ts=Math.max(0,Math.min(1,s))},
    up(){v.held=false;v.moving=false}});
  setTimeout(()=>frFollowEl(id,rpBox().x+130),0);
}
function rpSetL(L){const v=rpView;if(v.active)return;const from=v.Ld;Object.assign(v,{L,s:0,done:false,F:0});WMSIM.animate(600,k=>{v.Ld=from+(L-from)*k;frFollowEl(RP_CV,rpBox().x+130)},()=>{v.Ld=L})}

  if(!drag)WMSIM.animate(900+700*L,k=>{v.s=k;v.moving=k<1;v.held=true},()=>{v.s=1})}

      ['الإجابات',10*f(q[0])+10*f(q[2]),20],['تفسير النتيجة',10*f(q[1]),10],['التحدي العملي',tries?[0,10,7,4][Math.min(3,tries)]:0,10],['التطبيق في موقف جديد',10*f(q[3]),10]];
    const total=Math.round(parts.reduce((a,p)=>a+p[1],0)),byC={};

    byC.obs=r.obsScore>=.8;byC.fair=unfair===0;byC.calc=calc>=14.99;byC.scales=scl>=9.99;

  },
  log(r){const x=r.n3;return {topic:'newton3',pred:x.pred,rows:x.rows.map(w=>({F:w.F,rec:w.rec.slice(0,3)})),runs:x.runs.slice(0,30),

/* ---- المشهد (أ): ميزانان متصلان بين جدار وشخص ---- */
const N3_G=205,N3_Y=N3_G-86;
const n3sc={F:10,Fs:0,active:false,auto:false,held:false,dragF:0,hold:0,done:false,onEnd:null};
const N3H={grab:null};
function n3ScGeo(F){const L=150+F*1.2;return {a:64,j:64+L,b:64+2*L}}
function n3ScDraw(c,col,t,dt){
  const W=800,H=270,G=N3_G,Y=N3_Y,v=n3sc;
  WMD.bg(c,col,W,H,G);
  if(v.active){const target=v.auto?v.F:(v.held?Math.min(v.F,v.dragF):0);v.Fs+=(target-v.Fs)*Math.min(1,dt*(v.auto?3:8));
    if(v.Fs>=v.F-.25){v.hold+=dt;if(v.hold>=.9){v.active=false;v.done=true;v.Fs=v.F;const f=v.onEnd;v.onEnd=null;f&&f()}}else v.hold=0}
  else if(!v.done)v.Fs*=Math.exp(-dt*5);
  const g=n3ScGeo(v.Fs);
  // جدار من الطوب وخطاف
  const x0=14,x1=56,top=30;c.fillStyle='#A9B4BE';c.fillRect(x0,top,x1-x0,G-top);
  for(let y=top,rw=0;y<G;y+=16,rw++){for(let x=x0-(rw%2?16:0);x<x1;x+=32){c.fillStyle=rw%2?'#B9C3CC':'#C6CFD7';c.fillRect(Math.max(x0,x)+1,y+1,Math.min(x+30,x1)-Math.max(x0,x)-2,14)}}
  c.strokeStyle='#5D6873';c.lineWidth=2;c.strokeRect(x0,top,x1-x0,G-top);c.fillStyle='#5D6873';WMD.rr(c,x1-2,Y-12,10,24,3);c.fill();
  // الميزانان
  WMD.scale(c,g.a,Y,g.j,Y,v.Fs,N3.maxF);WMD.scale(c,g.j,Y,g.b,Y,v.Fs,N3.maxF);
  WMD.pill(c,(g.a+g.j)/2,Y+30,'الميزان (أ)','#5D6873');WMD.pill(c,(g.j+g.b)/2,Y+30,'الميزان (ب)','#5D6873');
  // زوج الفعل ورد الفعل عند نقطة الاتصال
  if(v.Fs>.5){const L=24+v.Fs*2.4;
    WMD.arrow(c,g.j,Y-50,g.j+L,Y-50,'#C3473E');n3Lbl(c,g.j+L/2+30,Y-60,`ب يسحب أ: ${fx1(v.Fs)} N`,'#C3473E');
    WMD.arrow(c,g.j,Y-84,g.j-L,Y-84,'#2E7DB5');n3Lbl(c,g.j-L/2-30,Y-94,`أ يسحب ب: ${fx1(v.Fs)} N`,'#2E7DB5');
    c.save();c.setLineDash([4,4]);c.strokeStyle='rgba(19,50,74,.35)';c.lineWidth=1.5;c.beginPath();c.moveTo(g.j,Y-108);c.lineTo(g.j,Y-6);c.stroke();c.restore()}
  // الشخص يسحب
  const lean=v.Fs>.5?.12+.3*Math.min(1,v.Fs/40):0;
  WMD.person(c,{x:g.b+46,y:G,dir:-1,lean,phase:0,t,strain:v.Fs>25,shake:v.held&&v.Fs>30,hands:[{x:g.b+2,y:Y},{x:g.b+9,y:Y+3}],shirt:'#2E7DB5'});
  WMD.hud(c,560,12,[['قراءة الميزان (أ)',`${fx1(v.Fs)} N`,'#9BE6BF'],['قراءة الميزان (ب)',`${fx1(v.Fs)} N`,'#FFB4A8']]);
  if(v.done)WMD.pill(c,(g.a+g.b)/2,G+36,'✓ ثبتت القراءة — سجّلها في الجدول','#1E8A5C');
  else if(APP.run&&APP.run.step==='pull'&&!WMSIM.tweening()){if(!v.active)WMD.hint(c,g.b+20,Y-62,'امسك هنا واسحب →',t);else if(!v.auto&&v.Fs<v.F-.25)WMD.hint(c,g.b+20,Y-62,`اسحب حتى ${v.F} N →`,t)}
}
function n3Lbl(c,x,y,t,cl,al){c.save();c.font='bold 13px system-ui,sans-serif';c.textAlign=al||'center';c.fillStyle=cl;c.fillText(t,x,y);c.restore()}
function n3ScMount(id){const v=n3sc;Object.assign(v,{Fs:0,active:false,auto:false,held:false,dragF:0,dragBase:0,hold:0,done:false,onEnd:null});
  WMSIM.mount($(id),800,270,n3ScDraw,{
    hit(p){const g=n3ScGeo(v.Fs);return Math.hypot(p.x-g.b,p.y-N3_Y)<60||(p.x>g.b-10&&p.x<g.b+90&&p.y>N3_G-150&&p.y<N3_G)},
    down(){if(v.active&&!v.auto){v.held=true;return}if(!v.active&&N3H.grab&&N3H.grab()){v.held=true}},
    move(p,dl){if(v.active&&!v.auto&&v.held)v.dragF=Math.max(0,Math.min(v.F,dl.dx/2.2+v.dragBase))},
    up(){v.held=false;v.dragBase=v.Fs}});
  setTimeout(()=>frFollowEl(id,300),0)}
function n3ScStart(F,auto,onEnd){Object.assign(n3sc,{F,Fs:0,active:true,auto:!!auto,held:!auto,dragF:0,dragBase:0,hold:0,done:false,onEnd})}

/* ---- المشهد (ب): عربتان ونابض مضغوط على مسار ---- */

function n3CtDraw(c,col,t,dt){

  c.strokeStyle='#4A3420';c.fillStyle='#4A3420';c.font='10px system-ui,sans-serif';c.textAlign='center';

  n3Cart(c,rA-N3_CW,G,'#C3473E',v.mA,'الحمراء',v.F,-1);n3Cart(c,lB,G,'#2E7DB5',v.mB,'الزرقاء',v.F,1);

  if(v.F>.2){const L=30+v.F*7,ay=G-24;WMD.arrow(c,rA-N3_CW-4,ay,rA-N3_CW-4-L,ay,'#C3473E');n3Lbl(c,rA-N3_CW-4-L-6,ay+5,`ق = ${fx1(v.F)} N`,'#C3473E','right');
    WMD.arrow(c,lB+N3_CW+4,ay,lB+N3_CW+4+L,ay,'#2E7DB5');n3Lbl(c,lB+N3_CW+4+L+6,ay+5,`ق = ${fx1(v.F)} N`,'#2E7DB5','left')}
  // المسافتان بعد الانطلاق

      c.beginPath();c.moveTo(a0,G-50);c.lineTo(a0,G+62);c.moveTo(b0,G-50);c.lineTo(b0,G+62);c.stroke();c.restore();
    c.fillStyle='#5D6873';c.font='11px system-ui,sans-serif';c.textAlign='center';c.fillText('موضع البداية',a0+N3_CW/2,G-50);c.fillText('موضع البداية',b0+N3_CW/2,G-50);

function n3CtMount(id){Object.assign(n3ct,{cv:id,phase:'idle',sep:0,dA:0,dB:0,tm:0,F:0,onEnd:null});WMSIM.mount($(id),800,270,n3CtDraw,null);setTimeout(()=>frFollowEl(id,560),0)}
function n3CtSet(mA,mB){if(n3ct.phase==='push'||n3ct.phase==='slide')return;Object.assign(n3ct,{mA,mB,phase:'idle',sep:0,dA:0,dB:0,tm:0,F:0})}
function n3CtRelease(onEnd){const v=n3ct;Object.assign(v,{phase:'push',sep:0,dA:0,dB:0,tm:0,F:0});
  WMSIM.animate(450,k=>{v.sep=k;v.F=N3.Fs*Math.min(1,Math.sin(Math.PI*k)*1.6)},()=>{v.F=0;v.sep=1;v.phase='slide';
    WMSIM.animate(1600,k=>{v.tm=N3.T*k;v.dA=n3d(v.mA)*k;v.dB=n3d(v.mB)*k},()=>{v.tm=N3.T;v.dA=n3d(v.mA);v.dB=n3d(v.mB);v.phase='done';frFollowEl(v.cv,400);onEnd&&onEnd()},true)});
}

function n3Pull(auto){
  const r=APP.run,x=r.n3;if(r.step==='predict'){note('اختر توقعك أولًا.');return false}if(r.step!=='pull'||WMSIM.tweening()||n3sc.active)return false;
  const i=x.rows.findIndex(w=>!w.ok);if(i<0)return false;if(x.rows[i].done){note('سجّل قراءة الميزان (أ) في الجدول أولًا.');return false}
  const F=r.n3F;if(x.rows.some((w,j)=>j<i&&w.F===F)){note(`سحبت بقوة ${F} N من قبل. اختر قوة مختلفة لتقارن.`);return false}
  const w=x.rows[i];Object.assign(w,{F,rec:[],done:false});$('#n3Go').disabled=true;$('#nF'+i).textContent=`${F} N`;
  n3ScStart(F,auto,()=>{$('#n3Go').disabled=false;w.done=true;$('#nr'+i).disabled=false;$('#nr'+i+'r').disabled=false;$('#nr'+i).focus();n3Guide()});
  return true;
}
function n3RecRow(i){
  const r=APP.run,w=r.n3.rows[i];if(!w.done||w.ok)return;
  const v=parseNum($('#nr'+i).value);if(!isFinite(v)||v<0)return note('اكتب قراءة الميزان (أ) بالنيوتن، مثل ٢٠');
  w.rec.push(Math.round(v*10)/10);
  const fin=t=>{w.ok=true;$('#nr'+i+'o').textContent=t;$('#nr'+i).disabled=true;$('#nr'+i+'r').disabled=true};
  if(Math.abs(v-w.F)<.05)fin('✓');
  else if(w.rec.length<3){r.log.push(`قراءة غير دقيقة للميزان (أ): كتب ${v} N والسحب ${w.F} N`);note('انظر جيدًا إلى مؤشر الميزان (أ) القريب من الجدار في الرسم، واقرأ القيمة المكتوبة فوقه.',true)}
  else{$('#nr'+i).value=arNum(String(w.F));fin(`الصحيح ${w.F}`)}
  n3Guide();
}
function n3Release(){
  const r=APP.run,x=r.n3;if(r.step!=='carts'||WMSIM.tweening())return;
  const i=x.carts.findIndex(k=>!(k.recA&&k.recB));if(i<0)return;const k=x.carts[i];
  if(k.done)return note('سجّل سرعتي العربتين في الجدول أولًا.');
  const mA=r.n3mA,mB=r.n3mB,ok=i===0?mA===mB:mA!==mB;x.runs.push({row:i,mA,mB,ok});
  if(!ok){r.mist.exec++;r.log.push(`محاولة بكتلتين غير مناسبتين (${kg(mA)} و${kg(mB)} kg)`);
    note(i===0?'في المحاولة (أ) اجعل الكتلتين متساويتين، حتى نعرف ماذا يحدث عندما لا يختلف شيء بين العربتين.':'في المحاولة (ب) اختر كتلتين مختلفتين، وقارن بالمحاولة (أ).',true);return}
  Object.assign(k,{mA,mB,calc:{a:[],b:[]}});$('#n3Rel').disabled=true;$$('[data-ma],[data-mb]').forEach(b=>b.disabled=true);
  $('#nm'+i).textContent=`${kg(mA)} kg و${kg(mB)} kg`;n3CtSet(mA,mB);
  n3CtRelease(()=>{k.done=true;$('#nfs'+i).textContent=`${N3.Fs} N و${N3.Fs} N`;['a','b'].forEach(s=>{$(`#nv${s}${i}`).disabled=false;$(`#nv${s}${i}r`).disabled=false});$(`#nva${i}`).focus();n3Guide()});
}
function n3RecV(i,s){
  const r=APP.run,k=r.n3.carts[i],flag=s==='a'?'recA':'recB',m=s==='a'?k.mA:k.mB,id=`nv${s}${i}`;if(!k.done||k[flag])return;
  const v=parseNum($('#'+id).value);if(!isFinite(v)||v<0)return note('اكتب السرعة بالمتر لكل ثانية، مثل ٠٫٩');
  k.calc[s].push(Math.round(v*100)/100);const t=n3v(m);
  const fin=tx=>{k[flag]=true;$('#'+id+'o').textContent=tx;$('#'+id).disabled=true;$('#'+id+'r').disabled=true};
  if(Math.abs(v-t)<=.05)fin('✓');
  else if(k.calc[s].length<3){r.log.push(`حساب سرعة غير دقيق (${kg(m)} kg): ${v}`);note(`راجع الحساب: السرعة = المسافة ÷ الزمن = ${fx2(n3d(m))} ÷ ${fx2(N3.T)}.`,true)}
  else{$('#'+id).value=arNum(fx2(t));fin(`الصحيح ${fx2(t)}`)}
  if(k.recA&&k.recB){$$('[data-ma],[data-mb]').forEach(b=>b.disabled=false);$('#n3Rel').disabled=false}
  n3Guide();
}
function n3ShowB(){const box=$('#n3PartB');if(!box||box.dataset.on)return;box.dataset.on='1';box.classList.remove('hide-b');$('#n3Go').disabled=true;$$('[data-nf]').forEach(b=>b.disabled=true);
  n3CtMount('#n3B');n3CtSet(APP.run.n3mA,APP.run.n3mB);box.scrollIntoView({behavior:'smooth',block:'nearest'})}
function n3Guide(){
  const r=APP.run,x=r.n3,t=$('#gtext'),act=$('#gact');if(!t)return;act.innerHTML='';
  const cyc=$('#cyc');if(cyc)cyc.innerHTML=cycleHTML(r.step==='predict'?0:r.step==='observe'?2:1);
  if(r.step==='predict'){
    t.textContent='قبل أن تجرّب: إذا سحبت الميزان (ب) بقوة 20 N، فإن الميزان (أ) المثبت في الجدار يقرأ…';
    act.innerHTML=[['less','أقل من 20 N'],['equal','20 N تمامًا'],['more','أكثر من 20 N'],['zero','صفرًا؛ الجدار لا يسحب']].map(([k,l])=>`<button class="btn amber" data-pred="${k}" style="padding:7px 14px">${l}</button>`).join('');
    $$('[data-pred]',act).forEach(b=>b.onclick=()=>{x.pred=b.dataset.pred;r.step='pull';note('سجّلنا توقعك. جرّب الآن وتحقق منه.');n3Guide()});return;
  }
  if(r.step==='pull'){
    const i=x.rows.findIndex(w=>!w.ok);
    if(i<0){r.step='carts';n3ShowB();return n3Guide()}
    if(x.rows[i].done){t.textContent=bidi(`اقرأ الميزان (أ) في الرسم واكتب قراءته في السحبة ${i+1}.`);return}
    t.textContent=bidi(i===0?'اختر قوة، ثم اسحب الميزان (ب) وراقب الميزانين معًا.':`السحبة ${i+1}: اختر قوة مختلفة عن السابقة، واسحب من جديد.`);return;
  }
  if(r.step==='carts'){
    const i=x.carts.findIndex(k=>!(k.recA&&k.recB));
    if(i<0){t.textContent='أكملت الجزأين. قارن الجدولين، ثم سجّل ملاحظاتك.';
      act.innerHTML='<button class="btn amber" id="n3ObsGo">سجّل ملاحظاتي</button>';$('#n3ObsGo').onclick=()=>{r.step='observe';n3Guide();wmObs(N3_OBS,N3_OBS_SET,'newton3')};return}
    const k=x.carts[i];
    if(k.done){t.textContent=bidi('احسب سرعة كل عربة: السرعة = المسافة على المسطرة ÷ الزمن (0.5 s)، واكتبها في الجدول.');return}
    t.textContent=bidi(i===0?'المحاولة (أ): اجعل كتلتي العربتين متساويتين، ثم أطلق النابض وراقب حسّاسَي القوة.':'المحاولة (ب): اختر كتلتين مختلفتين، ثم أطلق النابض. هل ستختلف القوتان؟');return;
  }
  if(r.step==='observe')t.textContent='ماذا لاحظت؟ اختر ملاحظاتك تحت الجدول.';
}

/* ===================== 🧊 تجربة الخواص والتغيرات الفيزيائية =====================

    if(!w.sub){t.textContent=bidi(`كتلة العينة ${s.lbl} = ${s.m} g. الآن اسحبها إلى فوهة المخبار، وأنزلها بيدك داخله حتى تقترب من الماء ثم اتركها؛ لا ترمها من الأعلى حتى لا يتطاير الماء.`);return}

      foil:'اضغط بإصبعك على ورقة الألومنيوم وحرّكه لتكبسها كرة صغيرة، ثم ارفع إصبعك.',

    if(!w.done){t.textContent=bidi(`التغيّر ${j+1}: ${ch.t}. الميزان يقرأ ${ch.m} g قبل التغيّر. ${how} راقب الميزان، وانتظر النقطة الخضراء.`);return}

/* تحويل كل نص يظهر للطالب: نصوص اللوحات (canvas) وعُقد الصفحة */
(function(){
  const P=CanvasRenderingContext2D.prototype,orig=P.fillText;
  P.fillText=function(t,x,y,mw){const s=arNum(t);
    if(s!==String(t)){const d=this.direction;this.direction='rtl';const r=mw===undefined?orig.call(this,s,x,y):orig.call(this,s,x,y,mw);this.direction=d;return r}
    return mw===undefined?orig.call(this,s,x,y):orig.call(this,s,x,y,mw)};
  const SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1};
  /* كل جدول يأخذ عناوين أعمدته في data-label لتظهر داخل البطاقة على الجوال */
  const cardify=el=>{const ts=el.tagName==='TABLE'?[el]:el.querySelectorAll?[...el.querySelectorAll('table')]:[];
    ts.forEach(t=>{const hs=[...t.querySelectorAll('thead th')].map(x=>x.textContent.trim());if(!hs.length)return;t.classList.add('cards');
      t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{if(hs[i]!==undefined&&td.dataset.label!==hs[i])td.dataset.label=hs[i]}))})};
  const conv=n=>{
    if(n.nodeType===3){const p=n.parentNode;if(!p||SKIP[p.nodeName])return;const v=n.nodeValue;if(/\d/.test(v)){const a=arNum(v);if(a!==v)n.nodeValue=a}}
    else if(n.nodeType===1){if(SKIP[n.nodeName])return;if(n.nodeName==='INPUT'){if(n.placeholder&&/\d/.test(n.placeholder))n.placeholder=arNum(n.placeholder);return}
      for(const ch of n.childNodes)conv(ch)}
  };
  new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')conv(m.target);else m.addedNodes.forEach(n=>{conv(n);if(n.nodeType===1)cardify(n)})}})
    .observe(document.body,{subtree:true,childList:true,characterData:true});
  conv(document.body);cardify(document.body);
})();

/* 🧭 المرشد: الضغط عليه (أو على «📍 خذني للخطوة») يأخذ الطالب إلى مكان الخطوة الحالية ويُبرزه.
   وعلى الجوال يلتصق أسفل الشاشة (CSS)، ويتمدد ويومض كلما تغيّر توجيهه حتى يعرف الطالب خطوته التالية */
function guideTarget(){
  const vis=e=>e&&e.offsetParent!==null&&e.getClientRects().length;
  const r=APP.run;
  // المخاليط: الرفوف والبيكر حسب الخطوة
  if(r&&$('#app .bench.stick')){const m={safety:'#tools',choose:'#shelf',addFirst:'#shelf',addSecond:'#shelf',stir:'#tools',watch:'#bz',stirring:'#bz',observe:'#obsPanel'}[r.step];
    const e=m&&$(m);if(vis(e))return {el:e.closest('.panel')||e}}
  // خانة تنتظر أن يكتب فيها الطالب
  const inp=$$('#app .frin').find(x=>!x.disabled&&vis(x));if(inp)return {el:inp.closest('tr')||inp,focus:inp};
  // الملاحظات
  const ob=$('#obsPanel .obs');if(vis(ob))return {el:ob};
  // آخر شريط تحكم ظاهر فيه زر أو خيار متاح (القوة، المسافة، الكتلة، زر التشغيل)
  const bars=$$('#app .frbar').filter(b=>vis(b)&&$$('button,input,select',b).some(x=>!x.disabled));
  if(bars.length)return {el:bars[bars.length-1]};
  const cv=$$('#app .frzone').filter(vis).pop();if(cv)return {el:cv};
  const sd=$('#app .side .panel');if(vis(sd))return {el:sd};
  return null;
}
function guideGo(){
  const t=guideTarget();if(!t)return false;const el=t.el;
  el.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.remove('gtarget');void el.offsetWidth;el.classList.add('gtarget');clearTimeout(el._gt);el._gt=setTimeout(()=>el.classList.remove('gtarget'),2600);
  if(t.focus)setTimeout(()=>{try{t.focus.focus({preventScroll:true})}catch(e){}},450);
  return true;
}
(function(){
  const mq=matchMedia('(max-width:760px)'),root=document.documentElement;let cur=null,ro=null,mo=null;
  const setH=()=>{if(cur&&mq.matches)root.style.setProperty('--gdock',cur.offsetHeight+'px')};
  const key=g=>((g.querySelector('#gtext')||{}).textContent||'')+'|'+((g.querySelector('#gact')||{}).textContent||'');
  function detach(){ro&&ro.disconnect();mo&&mo.disconnect();ro=mo=null;cur=null;document.body.classList.remove('has-gdock')}
  function attach(g){
    if(cur===g)return;detach();cur=g;
    const dock=mq.matches&&!g.closest('.bench.stick');
    // زر «خذني للخطوة» + الضغط على نص المرشد
    const gt=g.querySelector('.gt');
    if(gt&&!g.querySelector('.ggo')){const go=document.createElement('button');go.type='button';go.className='ggo';go.textContent='📍 خذني للخطوة';
      go.onclick=e=>{e.stopPropagation();if(!guideGo())note('أكمل ما في المرشد هنا أولًا.')};gt.appendChild(go)}
    g.classList.add('gclick');
    let b=null;const open=v=>{g.classList.toggle('gmin',!v);if(b)b.textContent=v?'⌄':'⌃';setH()};
    if(dock){document.body.classList.add('has-gdock');
      b=document.createElement('button');b.type='button';b.className='gtog';b.setAttribute('aria-label','تصغير المرشد أو إظهاره');b.textContent='⌄';
      b.onclick=e=>{e.stopPropagation();open(g.classList.contains('gmin'))};g.appendChild(b);
      ro=new ResizeObserver(setH);ro.observe(g)}
    g.addEventListener('click',e=>{if(e.target.closest('button,a,input,select'))return;
      if(g.classList.contains('gmin')){open(true);return}guideGo()});
    let last=key(g);
    mo=new MutationObserver(()=>{const k=key(g);if(k===last)return;last=k;if(!dock)return;open(true);g.classList.remove('gnew');void g.offsetWidth;g.classList.add('gnew');g.scrollTop=0});
    mo.observe(g,{subtree:true,childList:true,characterData:true});setH();
  }
  function scan(){const g=document.querySelector('#app .bench>.guide');if(g)attach(g);else detach()}
  new MutationObserver(scan).observe(app,{childList:true});
  (mq.addEventListener?mq.addEventListener('change',()=>{detach();scan()}):mq.addListener(()=>{detach();scan()}));
  scan();
})();

if(PORTAL.hw) portalBoot(); else go('home');
</script>
