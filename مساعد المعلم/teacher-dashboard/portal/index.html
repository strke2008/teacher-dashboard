<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مساعد المعلم</title>
<meta name="robots" content="noindex">
<script>
/* 🔀 بوابة المعلم أُلغيت: كل ميزاتها في لوحة التحكم الآن. الروابط القديمة (أيقونة الشاشة الرئيسية، المفضلة،
   تنبيه حصة قديم) تُحوَّل للوحة بالمعنى نفسه، ويُلغى عامل البوابة القديم ونسخته المحفوظة على الجهاز. */
(function(){
  var q = new URLSearchParams(location.search), to = '../', m = /^(\d{4}-\d{2}-\d{2})\.(\d{1,2})$/.exec(q.get('lesson') || '');
  if (m) to += '?open=lesson&d=' + m[1] + '&p=' + m[2];
  else if (q.get('tasks')) to += '?open=tasks';
  else if (q.get('open')) to += '?' + q.toString();
  try {
    if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){ if (r.scope === new URL('./', location.href).href) r.unregister().catch(function(){}); }); }).catch(function(){});
    if (window.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ if (k.indexOf('tp-') === 0) caches.delete(k); }); }).catch(function(){});
  } catch (e) {}
  location.replace(to + location.hash);
})();
</script>
</head><body style="font-family:system-ui,sans-serif;text-align:center;padding:3rem 1rem;color:#16233A">
<p>بوابة المعلم صارت جزءًا من لوحة التحكم — جارٍ فتحها…</p>
<p><a href="../">افتح لوحة التحكم</a></p>
</body></html>
